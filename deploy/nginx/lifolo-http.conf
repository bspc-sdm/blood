# Lifolo — TLS সার্টিফিকেট পাওয়ার আগের (শুধু HTTP, শুধু Let's Encrypt যাচাই) সাইট। setup-vps.sh __DOMAIN__ বদলে
# /etc/nginx/sites-available/lifolo-এ রাখে; সার্টিফিকেট পেলে lifolo-https.conf দিয়ে বদলে যায়।
# অচেনা Host (IP দিয়ে স্ক্যান ইত্যাদি) — উত্তর ছাড়াই বন্ধ
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 444; }
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # সার্টিফিকেট পাওয়ার আগে অ্যাপ খোলা http-তে নয় (লগইন টোকেন/কুকি খোলা অবস্থায় যেত)
    location / {
        default_type text/plain;
        return 503 "Lifolo: HTTPS setup in progress\n";
    }
}
