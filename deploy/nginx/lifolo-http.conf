# Lifolo — TLS সার্টিফিকেট পাওয়ার আগের (শুধু HTTP) সাইট। setup-vps.sh __DOMAIN__ বদলে
# /etc/nginx/sites-available/lifolo-এ রাখে; সার্টিফিকেট পেলে lifolo-https.conf দিয়ে বদলে যায়।
limit_req_zone $binary_remote_addr zone=lifolo_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=lifolo_web:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=lifolo_conn:10m;

upstream lifolo_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# অচেনা Host (IP দিয়ে স্ক্যান ইত্যাদি) — উত্তর ছাড়াই বন্ধ
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 444; }
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    include /etc/nginx/snippets/lifolo-common.conf;
}
