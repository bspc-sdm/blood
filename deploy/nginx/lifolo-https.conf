# Lifolo — HTTPS সাইট (Let's Encrypt)। setup-vps.sh __DOMAIN__ বদলে /etc/nginx/sites-available/lifolo-এ রাখে।
limit_req_zone $binary_remote_addr zone=lifolo_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=lifolo_web:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=lifolo_conn:10m;

upstream lifolo_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# অচেনা Host — উত্তর ছাড়াই বন্ধ (HTTPS-এ সার্টিফিকেটও দেখানো হয় না)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 444; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# HTTP → HTTPS (সার্টিফিকেট নবায়নের পথ বাদে)
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:lifolo_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Vercel-এর মতো HSTS (২ বছর)
    add_header Strict-Transport-Security "max-age=63072000" always;

    include /etc/nginx/snippets/lifolo-common.conf;
}
