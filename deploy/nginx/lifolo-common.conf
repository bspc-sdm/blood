# Lifolo — দুই nginx সাইট ফাইলের (http-only আর https) একই অংশ। setup-vps.sh এটা
# /etc/nginx/snippets/lifolo-common.conf-এ রাখে। সব অনুরোধ Node সার্ভারে যায় (vercel.json-এর নিয়ম সেখানে)।

# Vercel-এর অনুরোধের সীমা ৪.৫ MB (সবচেয়ে বড় আপলোড: যাচাইয়ের ছবি base64) — একটু বেশি রাখা, বাকিটা সার্ভার 413 দেয়
client_max_body_size 5m;
client_body_buffer_size 256k;
client_header_timeout 15s;
client_body_timeout 30s;
send_timeout 60s;
keepalive_timeout 65s;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml application/xml;

# আসল ক্লায়েন্টের IP: ক্লায়েন্টের পাঠানো X-Forwarded-For মুছে nginx যা দেখেছে শুধু সেটা (Vercel-এর মতো) —
# কোড রেট-লিমিটে x-forwarded-for-এর প্রথম মান পড়ে, তাই এটা ক্লায়েন্ট বদলাতে পারে না
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_buffers 16 16k;
proxy_buffer_size 16k;

# API: প্রতি IP-তে ভদ্র সীমা — মোবাইল অপারেটরের এক IP-র পেছনে অনেক মানুষ থাকেন, তাই বড় burst।
# আসল সীমা (অতিথি মিনিটে ২৪০, লগইন কোড ইত্যাদি) সার্ভারের কোডেই আছে।
location /api/ {
    limit_req zone=lifolo_api burst=100 nodelay;
    limit_req_status 429;
    limit_conn lifolo_conn 60;
    # API-র সময়সীমা (maxDuration, ডিফল্ট ৩০০ সে.) সার্ভার নিজে দেখে; nginx তার চেয়ে একটু বেশি অপেক্ষা করে
    proxy_read_timeout 310s;
    proxy_pass http://lifolo_app;
}

location / {
    limit_req zone=lifolo_web burst=200 nodelay;
    limit_req_status 429;
    limit_conn lifolo_conn 60;
    proxy_read_timeout 70s;
    proxy_pass http://lifolo_app;
}
