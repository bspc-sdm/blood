jobrunr:
  background-job-server:
    enabled: false
lifolo:
  firebase:
    enabled: false
  admin-emails: owner@example.com
  cron-secret: test-cron-secret
  web-session-secret: test-secret
  email-code-secret: test-secret-key
  # feature switches: every key on in tests (FeaturesIT turns it off for its own checks)
  features:
    all-on: true
logging:
  level:
    root: WARN
    com.lifolo: INFO
