jobrunr:
  background-job-server:
    enabled: false
lifolo:
  firebase:
    enabled: false
  admin-emails: owner@example.com
  cron-secret: test-cron-secret
  web-session-secret: test-secret
  email-code-secret: test-secret-key
  # every feature switch on in tests (calls shim until the flags package lands)
  feature-shim:
    keys: "*"
  demo:
    online-chambers: true
  # receipts' feature switches (invoices/InvoiceFeatures shim until the flags package lands): all on in tests
  features-shim-on: true
logging:
  level:
    root: WARN
    com.lifolo: INFO
