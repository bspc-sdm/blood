# নোটিফিকেশন চাপার পরের অবস্থা (adb am start-এর পরে, অ্যাপ নতুন করে খোলা হয় না): WANT দেখা যায় (আর WANT2 থাকলে সেটাও), ছবি SHOT
# প্রেসক্রিপশনের পাতায় এখন ওপরে "এখন কোন অবস্থায়" (RxStatus) — রোগ/ওষুধ নিচে, তাই না দেখা গেলে নিচে সরে খোঁজা
appId: com.bspc.blood
env:
  WANT2: ""
---
- runFlow: ../common/dismiss.yaml
- extendedWaitUntil:
    visible: "${WANT}"
    timeout: 40000
    optional: true
- scrollUntilVisible:
    element: "${WANT}"
    direction: DOWN
    timeout: 20000
- runFlow:
    when:
      true: ${WANT2 != ''}
    commands:
      - scrollUntilVisible:
          element: "${WANT2}"
          direction: DOWN
          timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${SHOT}
