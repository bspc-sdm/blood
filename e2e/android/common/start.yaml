# অ্যাপ নতুন করে খোলা (সব ডেটা মুছে) → এলাকা ময়মনসিংহ → লগইন → ডেমো রোল
# env: J (যাত্রার নাম, ছবির নামের শুরু), ROLE (ডেমো তালিকায় যে নামে চাপতে হবে)
appId: com.bspc.blood
---
- launchApp:
    clearState: true
    permissions:
      all: deny
      notifications: allow
- extendedWaitUntil:
    visible: ".*জেলা খুঁজুন.*"
    timeout: 60000
- takeScreenshot: ${J}-00a-location
- tapOn: ".*জেলা খুঁজুন.*"
- inputText: "Mymensingh"
- hideKeyboard
- tapOn: "ময়মনসিংহ.*"
- extendedWaitUntil:
    visible: "লগইন"
    timeout: 40000
- tapOn: "লগইন"
- scrollUntilVisible:
    element: ".*${ROLE}.*"
    direction: DOWN
    timeout: 60000
- takeScreenshot: ${J}-00b-login
- tapOn: ".*${ROLE}.*"
- extendedWaitUntil:
    visible: "সেটিংস ও প্রোফাইল"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
