# যাত্রা ১৬ — অনলাইন (ভিডিও) চেম্বার (OnlineChamber.kt):
# (ডেমোতে ডাক্তারের অনলাইন চেম্বার আগে থেকেই আছে — প্রতিদিন দুপুর ১টা–৪টা, ৳৪০০; তখন শুধু দেখা আর ছবি)
# ১) ডাক্তার: সেটআপে "চেম্বার যোগ করুন" → "অনলাইন (ভিডিও)" → শনিবার দুপুর ১টা–২টা, ফি, bKash (ডেমোর নম্বর), নোট → সেভ
#    (ডেমো হাসানের চেম্বার: প্রতিদিন ১০–১টা আর ৪টা–রাত ১টা, শুক্র ২টা–৩:৩০ — তাই শনিবার ১টা–২টা মেলে না; আগের চালানোর
#    অনলাইন চেম্বার থাকলে আর যোগ করা হয় না)
# ২) রোগী: "অনলাইন (ভিডিও)" ছাঁকনি → ডাক্তার → অনলাইন চেম্বার → বুকিং; আমার অ্যাপয়েন্টমেন্টে bKash নম্বর, ধাপ,
#    "টাকা পাঠিয়েছি" + TrxID → "যাচাই হচ্ছে"; ভিডিও কলের জায়গায় "সময় হলে এখানে বোতাম আসবে" (বা নিশ্চিত হলে বোতাম)
# ৩) ডাক্তার: বুকিং → অনলাইনের অ্যাপয়েন্টমেন্ট নিশ্চিত → "ফি পেয়েছি" → "হ্যাঁ, পেয়েছি" → "ফি পরিশোধিত"
# শুধু ডেমো অ্যাকাউন্ট (ডেমোর bKash নম্বর 0120000xxxx — কোনো অপারেটরের নয়)। সার্ভারে DEMO_ONLINE_CHAMBERS=true লাগে
# (প্রোডাকশনে বন্ধ) — তাই run.sh সব যাত্রার সাথে এটা চালায় না; স্টেজিংয়ে E2E_ONLY="j16"।
appId: com.bspc.blood
env:
  J: j16
  ROLE: ডা. ডেমো হাসান
---
# ---------- ১) ডাক্তার: অনলাইন চেম্বার ----------
- runFlow: ../common/start.yaml
- tapOn: "আমার কাজ"
- tapOn: ".*আমার চেম্বার.*"
- extendedWaitUntil:
    visible: ".*বুকিং.*"
    timeout: 30000
- tapOn: "সেটআপ"
- extendedWaitUntil:
    visible: ".*রোগীরা যেমন দেখবেন.*"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "online_head"
    direction: DOWN
    timeout: 15000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "online_head"
    commands:
      - scrollUntilVisible:
          element: "চেম্বার যোগ করুন"
          direction: DOWN
          timeout: 20000
      - tapOn: "চেম্বার যোগ করুন"
      - extendedWaitUntil:
          visible: "চেম্বারের ধরন"
          timeout: 10000
      - takeScreenshot: j16-01-type
      - tapOn: ".*অ্যাপে ভিডিও কলে.*"
      - scrollUntilVisible:
          element:
            id: "online_head"
          direction: DOWN
          timeout: 15000
          centerElement: true
      # শনিবার
      - tapOn:
          text: "শনি"
          below:
            id: "online_head"
          index: 0
      # শুরু দুপুর ১টা (ঘড়িতে ১, বিকেল-ভাগ আগে থেকেই বাছা), শেষ দুপুর ২টা
      - tapOn:
          text: "শুরুর সম(?:য়|য়)"
          below:
            id: "online_head"
          index: 0
      - tapOn: "(১|1)"
      - tapOn: "ঠিক আছে"
      - tapOn:
          text: "শেষের সম(?:য়|য়)"
          below:
            id: "online_head"
          index: 0
      - tapOn: "(২|2)"
      - tapOn: "ঠিক আছে"
      - scrollUntilVisible:
          element:
            id: "online_fee"
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: "online_fee"
      - inputText: "500"
      - hideKeyboard
      - tapOn:
          id: "online_bkash"
      - inputText: "01200000202"
      - hideKeyboard
      - tapOn:
          id: "online_note"
      - inputText: "Demo: keep old reports ready"
      - hideKeyboard
      - takeScreenshot: j16-02-online-setup
      - scrollUntilVisible:
          element: "সেভ করুন"
          direction: DOWN
          timeout: 15000
      - tapOn: "সেভ করুন"
      - extendedWaitUntil:
          notVisible: "সেভ করুন"
          timeout: 30000
      - takeScreenshot: j16-03-saved
- takeScreenshot: j16-04-setup

# ---------- ২) রোগী: বুকিং আর "টাকা পাঠিয়েছি" ----------
- runFlow:
    file: ../common/start.yaml
    env:
      J: j16p
      ROLE: ডেমো রোগী রহিম
- tapOn: "অ্যাপ(?:য়|য়)েন্টমেন্ট"
- extendedWaitUntil:
    visible: ".*ডা\\. ডেমো.*"
    timeout: 30000
# নতুন তালিকা (২.৩৭.০): "অনলাইন (ভিডিও)" এক সারির চিপে অনেক ডানে (ফিল্টার · চার পদ্ধতি · আজ · কাল · এখন চেম্বারে ·
# অনলাইন) — সারিটা বাঁয়ে সরিয়ে চিপ (testTag chip_online), তাতে শুধু অনলাইন চেম্বারের ডাক্তার; না মিললে তালিকায় নেমে খোঁজা
- repeat:
    while:
      notVisible:
        id: "chip_online"
    times: 5
    commands:
      - runFlow:
          when:
            visible:
              id: "system_chips"
          commands:
            - swipe:
                from:
                  id: "system_chips"
                direction: LEFT
      - runFlow:
          when:
            visible:
              id: "listing_chips"
          commands:
            - swipe:
                from:
                  id: "listing_chips"
                direction: LEFT
      - waitForAnimationToEnd:
          timeout: 2000
- tapOn:
    id: "chip_online"
- extendedWaitUntil:
    visible: ".*ডা\\. ডেমো হাসান.*"
    timeout: 20000
    optional: true
- scrollUntilVisible:
    element: ".*ডা\\. ডেমো হাসান.*"
    direction: DOWN
    timeout: 30000
- takeScreenshot: j16-05-online-list
- tapOn: ".*ডা\\. ডেমো হাসান.*"
- extendedWaitUntil:
    visible: ".*চেম্বার বেছে অ্যাপ(?:য়|য়)েন্টমেন্ট নিন.*"
    timeout: 30000
- tapOn:
    text: ".*অনলাইন ভিডিও পরামর্শ.*"
    index: 0
- extendedWaitUntil:
    visible: ".*ঠিকানা লাগবে না.*"
    timeout: 20000
- tapOn: ".*কী সমস্যা.*"
- inputText: "Demo online visit"
- hideKeyboard
- takeScreenshot: j16-06-book
- tapOn: "অনুরোধ পাঠান"
# আগের চালানোর বুকিং থাকলে সার্ভার না বলতে পারে — তখন ঘর বন্ধ করে এগোনো
- runFlow:
    when:
      visible: "অনুরোধ পাঠান"
    commands:
      - takeScreenshot: j16-06b-book-error
      - tapOn: "বাতিল"
- back
- tapOn: "সেটিংস ও প্রোফাইল"
- scrollUntilVisible:
    element: ".*আমার অ্যাপ(?:য়|য়)েন্টমেন্ট.*"
    direction: DOWN
    timeout: 20000
- tapOn: ".*আমার অ্যাপ(?:য়|য়)েন্টমেন্ট.*"
- scrollUntilVisible:
    element:
      id: "online_patient_panel"
    direction: DOWN
    timeout: 30000
    centerElement: true
- takeScreenshot: j16-07-patient-online
# পুরোনো পথ (লাইফলো পে-র অনুরোধ ছাড়া): "টাকা পাঠিয়েছি" → TrxID → "ডাক্তারকে জানান"। লাইফলো পে-র শিটে (pay_claim)
# পাঠানো এখানে নয় (ডেমোতে রোগীর একটা দাবি আগে থেকেই যাচাইয়ে — একসাথে একটাই চলে; শিটের পাঠানো j22-এর এলাকা)
- runFlow:
    when:
      visible: "(টাকা|আবার) পাঠি(?:য়|য়)েছি"
      notVisible:
        id: "pay_claim"
    commands:
      - tapOn: "(টাকা|আবার) পাঠি(?:য়|য়)েছি"
      - extendedWaitUntil:
          visible:
            id: "pay_trxid"
          timeout: 10000
      - tapOn:
          id: "pay_trxid"
      # প্রতিবার নতুন TrxID (একই TrxID আবার দিলে সার্ভার ৪০৯ দেয়)
      - inputRandomText:
          length: 10
      - hideKeyboard
      - takeScreenshot: j16-08-claim
      - tapOn: "ডাক্তারকে জানান"
- extendedWaitUntil:
    visible: ".*(যাচাই হচ্ছে|ফি পরিশোধিত|পাঠানো হয়নি).*"
    timeout: 30000
- extendedWaitUntil:
    visible: ".*(সম(?:য়|য়) হলে এখানে বোতাম আসবে|ভিডিও কলে যুক্ত হোন|ডাক্তার নিশ্চিত করলে ভিডিও কলের বোতাম আসবে|ভিডিও কলের সম(?:য়|য়) পেরি(?:য়|য়)ে গেছে).*"
    timeout: 10000
    optional: true
- takeScreenshot: j16-09-claimed

# ---------- ৩) ডাক্তার: নিশ্চিত আর "ফি পেয়েছি" ----------
# বুকিং-এর ভাগ: নতুন (অপেক্ষায়) · চলছে (নিশ্চিত) · শেষ। আজকের অনলাইন বুকিং "নতুন"-এ — নিশ্চিত করলে "চলছে"-এ যায়।
# "চলছে"-এ ফি যাচাই বাকি থাকলে (ডেমোর "প্রেসারের ফলো-আপ", TrxID DEMO8X2K4P, বা রোগীর এইমাত্র পাঠানো) সেটাতে
# "ফি পেয়েছি"; না থাকলে (একই ডেমো দিনে আগের চালানো নিশ্চিত করে ফেলেছে) প্রথম অনলাইন অ্যাপয়েন্টমেন্টের "ফি পেয়েছি"
- runFlow:
    file: ../common/start.yaml
    env:
      J: j16d
      ROLE: ডা. ডেমো হাসান
- tapOn: "আমার কাজ"
- tapOn: ".*আমার চেম্বার.*"
- extendedWaitUntil:
    visible: ".*বুকিং.*"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "online_staff_panel"
    direction: DOWN
    timeout: 20000
    centerElement: true
    optional: true
- takeScreenshot: j16-10a-doctor-new
- runFlow:
    when:
      visible:
        text: "নিশ্চিত করুন"
        above:
          id: "online_staff_panel"
    commands:
      - tapOn:
          text: "নিশ্চিত করুন"
          above:
            id: "online_staff_panel"
      - extendedWaitUntil:
          visible: ".*রোগীর জন্য নোট.*"
          timeout: 10000
      - tapOn:
          text: "নিশ্চিত করুন"
          below: ".*রোগীর জন্য নোট.*"
      - extendedWaitUntil:
          notVisible: ".*রোগীর জন্য নোট.*"
          timeout: 20000
- scrollUntilVisible:
    element:
      id: "work_segs"
    direction: UP
    timeout: 20000
- tapOn:
    text: "চলছে.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element: "ফি যাচাই করুন"
    direction: DOWN
    timeout: 30000
    centerElement: true
    optional: true
- runFlow:
    when:
      notVisible: "ফি যাচাই করুন"
    commands:
      - scrollUntilVisible:
          element: "ফি পে(?:য়|য়)েছি"
          direction: UP
          timeout: 30000
          centerElement: true
- takeScreenshot: j16-10-doctor-fee
# কোন সারির "ফি পেয়েছি" — আগে ঠিক করে রাখা (ডায়ালগ খুললে তালিকা ঢেকে যায়, তখন "দেখা যায় না" শর্ত ভুল করে সত্যি হয়)
- evalScript: ${output.feeClaimed = false}
- runFlow:
    when:
      visible: "ফি যাচাই করুন"
    commands:
      - evalScript: ${output.feeClaimed = true}
- runFlow: ../common/fee-received.yaml
# দুই রকম ঘর, দুটোতেই তিনটা মিলের টিক (TrxID · টাকার অঙ্ক · শেষ ৪ সংখ্যা): লাইফলো পে-র অনুরোধ যাচাই বাকি থাকলে
# "টাকা পেয়েছেন?" (PayConfirmDialog), নইলে "ফি পেয়েছেন?" (appt_pay_confirm)
- extendedWaitUntil:
    visible: "(?:ফি|টাকা) পে(?:য়|য়)েছেন\\?"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: j16-11-confirm-fee
# যাচাই (RC4): টিকের লেখায় চাপলে ঘর বন্ধ হয়ে যায় কি না — লেখাটা চাপার যোগ্য নয়, চাপ পেছনের "বাইরে চাপলে বন্ধ"-এ যায়
# কি না দেখা। বন্ধ হলে ছবি (j16-11c) রেখে আবার খোলা; টিক দেওয়া হয় লেখার বাঁয়ের টিক-বাক্সে
- tapOn: "TrxID মিলেছে"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: j16-11b-after-label-tap
- runFlow:
    when:
      notVisible: "(?:ফি|টাকা) পে(?:য়|য়)েছেন\\?"
    commands:
      - takeScreenshot: j16-11c-sheet-closed-by-label-tap
      - runFlow: ../common/fee-received.yaml
      - extendedWaitUntil:
          visible: "(?:ফি|টাকা) পে(?:য়|য়)েছেন\\?"
          timeout: 10000
      - waitForAnimationToEnd:
          timeout: 5000
# ডায়ালগ আলাদা জানালা — testTag (pay_check_*, appt_check_*) resource-id হয় না, তাই লেখার বাঁয়ের টিক-বাক্স
- runFlow:
    when:
      visible: "TrxID মিলেছে"
    commands:
      - tapOn:
          leftOf: "TrxID মিলেছে"
- runFlow:
    when:
      visible: "টাকার অঙ্ক মিলেছে"
    commands:
      - tapOn:
          leftOf: "টাকার অঙ্ক মিলেছে"
- runFlow:
    when:
      visible: "শেষ ৪ সংখ্যা মিলেছে"
    commands:
      - tapOn:
          leftOf: "শেষ ৪ সংখ্যা মিলেছে"
- assertVisible: "(?:ফি|টাকা) পে(?:য়|য়)েছেন\\?"
- takeScreenshot: j16-11d-ticked
- tapOn: "হ্যাঁ, পে(?:য়|য়)েছি"
# ঘর বন্ধ (সার্ভার নিয়েছে; না নিলে ঘরে লাল লেখা থেকে যায়)
- extendedWaitUntil:
    notVisible: "(?:ফি|টাকা) পে(?:য়|য়)েছেন\\?"
    timeout: 30000
- extendedWaitUntil:
    visible: "ফি পরিশোধিত"
    timeout: 30000
- takeScreenshot: j16-12-paid
