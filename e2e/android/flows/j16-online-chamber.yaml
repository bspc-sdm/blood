# যাত্রা ১৬ — অনলাইন (ভিডিও) চেম্বার (OnlineChamber.kt):
# ১) ডাক্তার: সেটআপে "চেম্বার যোগ করুন" → "অনলাইন (ভিডিও)" → শনিবার দুপুর ১টা–২টা, ফি, bKash (ডেমোর নম্বর), নোট → সেভ
#    (ডেমো হাসানের চেম্বার: প্রতিদিন ১০–১টা আর ৪টা–রাত ১টা, শুক্র ২টা–৩:৩০ — তাই শনিবার ১টা–২টা মেলে না; আগের চালানোর
#    অনলাইন চেম্বার থাকলে আর যোগ করা হয় না)
# ২) রোগী: "অনলাইন (ভিডিও)" ছাঁকনি → ডাক্তার → অনলাইন চেম্বার → বুকিং; আমার অ্যাপয়েন্টমেন্টে bKash নম্বর, ধাপ,
#    "টাকা পাঠিয়েছি" + TrxID → "যাচাই হচ্ছে"; ভিডিও কলের জায়গায় "সময় হলে এখানে বোতাম আসবে" (বা নিশ্চিত হলে বোতাম)
# ৩) ডাক্তার: বুকিং → অনলাইনের অ্যাপয়েন্টমেন্ট নিশ্চিত → "ফি পেয়েছি" → "হ্যাঁ, পেয়েছি" → "ফি পরিশোধিত"
# শুধু ডেমো অ্যাকাউন্ট (ডেমোর bKash নম্বর 0120000xxxx — কোনো অপারেটরের নয়)।
appId: com.bspc.blood
env:
  J: j16
  ROLE: ডা. ডেমো হাসান
---
# ---------- ১) ডাক্তার: অনলাইন চেম্বার ----------
- runFlow: ../common/start.yaml
- tapOn: "আমার কাজ"
- tapOn: ".*আমার চেম্বার.*"
- extendedWaitUntil:
    visible: ".*বুকিং.*"
    timeout: 30000
- tapOn: "সেটআপ"
- extendedWaitUntil:
    visible: ".*রোগীরা যেমন দেখবেন.*"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "online_head"
    direction: DOWN
    timeout: 15000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "online_head"
    commands:
      - scrollUntilVisible:
          element: "চেম্বার যোগ করুন"
          direction: DOWN
          timeout: 20000
      - tapOn: "চেম্বার যোগ করুন"
      - extendedWaitUntil:
          visible: "চেম্বারের ধরন"
          timeout: 10000
      - takeScreenshot: j16-01-type
      - tapOn: ".*অ্যাপে ভিডিও কলে.*"
      - scrollUntilVisible:
          element:
            id: "online_head"
          direction: DOWN
          timeout: 15000
          centerElement: true
      # শনিবার
      - tapOn:
          text: "শনি"
          below:
            id: "online_head"
          index: 0
      # শুরু দুপুর ১টা (ঘড়িতে ১, বিকেল-ভাগ আগে থেকেই বাছা), শেষ দুপুর ২টা
      - tapOn:
          text: "শুরুর সম(?:য়|য়)"
          below:
            id: "online_head"
          index: 0
      - tapOn: "(১|1)"
      - tapOn: "ঠিক আছে"
      - tapOn:
          text: "শেষের সম(?:য়|য়)"
          below:
            id: "online_head"
          index: 0
      - tapOn: "(২|2)"
      - tapOn: "ঠিক আছে"
      - scrollUntilVisible:
          element:
            id: "online_fee"
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: "online_fee"
      - inputText: "500"
      - hideKeyboard
      - tapOn:
          id: "online_bkash"
      - inputText: "01200000202"
      - hideKeyboard
      - tapOn:
          id: "online_note"
      - inputText: "Demo: keep old reports ready"
      - hideKeyboard
      - takeScreenshot: j16-02-online-setup
      - scrollUntilVisible:
          element: "সেভ করুন"
          direction: DOWN
          timeout: 15000
      - tapOn: "সেভ করুন"
      - extendedWaitUntil:
          notVisible: "সেভ করুন"
          timeout: 30000
      - takeScreenshot: j16-03-saved
- takeScreenshot: j16-04-setup

# ---------- ২) রোগী: বুকিং আর "টাকা পাঠিয়েছি" ----------
- runFlow:
    file: ../common/start.yaml
    env:
      J: j16p
      ROLE: ডেমো রোগী রহিম
- tapOn: "অ্যাপ(?:য়|য়)েন্টমেন্ট"
- extendedWaitUntil:
    visible: ".*ডা\\. ডেমো.*"
    timeout: 30000
- runFlow:
    when:
      visible: "অনলাইন \\(ভিডিও\\)"
    commands:
      - tapOn: "অনলাইন \\(ভিডিও\\)"
- extendedWaitUntil:
    visible: ".*ডা\\. ডেমো হাসান.*"
    timeout: 30000
- takeScreenshot: j16-05-online-list
- tapOn: ".*ডা\\. ডেমো হাসান.*"
- extendedWaitUntil:
    visible: ".*চেম্বার বেছে অ্যাপ(?:য়|য়)েন্টমেন্ট নিন.*"
    timeout: 30000
- tapOn:
    text: ".*অনলাইন ভিডিও পরামর্শ.*"
    index: 0
- extendedWaitUntil:
    visible: ".*ঠিকানা লাগবে না.*"
    timeout: 20000
- tapOn: ".*কী সমস্যা.*"
- inputText: "Demo online visit"
- hideKeyboard
- takeScreenshot: j16-06-book
- tapOn: "অনুরোধ পাঠান"
# আগের চালানোর বুকিং থাকলে সার্ভার না বলতে পারে — তখন ঘর বন্ধ করে এগোনো
- runFlow:
    when:
      visible: "অনুরোধ পাঠান"
    commands:
      - takeScreenshot: j16-06b-book-error
      - tapOn: "বাতিল"
- back
- tapOn: "সেটিংস ও প্রোফাইল"
- scrollUntilVisible:
    element: ".*আমার অ্যাপ(?:য়|য়)েন্টমেন্ট.*"
    direction: DOWN
    timeout: 20000
- tapOn: ".*আমার অ্যাপ(?:য়|য়)েন্টমেন্ট.*"
- scrollUntilVisible:
    element:
      id: "online_patient_panel"
    direction: DOWN
    timeout: 30000
    centerElement: true
- takeScreenshot: j16-07-patient-online
- runFlow:
    when:
      visible: "(টাকা|আবার) পাঠি(?:য়|য়)েছি"
    commands:
      - tapOn: "(টাকা|আবার) পাঠি(?:য়|য়)েছি"
      - extendedWaitUntil:
          visible:
            id: "pay_trxid"
          timeout: 10000
      - tapOn:
          id: "pay_trxid"
      - inputText: "DEMO8N7A6B"
      - hideKeyboard
      - takeScreenshot: j16-08-claim
      - tapOn: "ডাক্তারকে জানান"
- extendedWaitUntil:
    visible: ".*(যাচাই হচ্ছে|ফি পরিশোধিত).*"
    timeout: 30000
- extendedWaitUntil:
    visible: ".*(সম(?:য়|য়) হলে এখানে বোতাম আসবে|ভিডিও কলে যুক্ত হোন|ডাক্তার নিশ্চিত করলে ভিডিও কলের বোতাম আসবে|ভিডিও কলের সম(?:য়|য়) পেরি(?:য়|য়)ে গেছে).*"
    timeout: 10000
- takeScreenshot: j16-09-claimed

# ---------- ৩) ডাক্তার: নিশ্চিত আর "ফি পেয়েছি" ----------
- runFlow:
    file: ../common/start.yaml
    env:
      J: j16d
      ROLE: ডা. ডেমো হাসান
- tapOn: "আমার কাজ"
- tapOn: ".*আমার চেম্বার.*"
- extendedWaitUntil:
    visible: ".*বুকিং.*"
    timeout: 30000
- scrollUntilVisible:
    element: "ফি যাচাই করুন"
    direction: DOWN
    timeout: 40000
    centerElement: true
- takeScreenshot: j16-10-doctor-claimed
# অ্যাপয়েন্টমেন্ট এখনো অপেক্ষায় থাকলে আগে নিশ্চিত (ফি নিশ্চিত করা যায় শুধু নিশ্চিত অ্যাপয়েন্টমেন্টে)
- runFlow:
    when:
      visible:
        text: "নিশ্চিত করুন"
        above:
          id: "online_staff_panel"
    commands:
      - tapOn:
          text: "নিশ্চিত করুন"
          above:
            id: "online_staff_panel"
      - extendedWaitUntil:
          visible: ".*রোগীর জন্য নোট.*"
          timeout: 10000
      - tapOn:
          text: "নিশ্চিত করুন"
          below: ".*রোগীর জন্য নোট.*"
      - extendedWaitUntil:
          notVisible: ".*রোগীর জন্য নোট.*"
          timeout: 20000
      - scrollUntilVisible:
          element: "ফি যাচাই করুন"
          direction: DOWN
          timeout: 30000
          centerElement: true
- tapOn:
    text: "ফি পে(?:য়|য়)েছি"
    below: "ফি যাচাই করুন"
    index: 0
- extendedWaitUntil:
    visible: "ফি পে(?:য়|য়)েছেন\\?"
    timeout: 10000
- takeScreenshot: j16-11-confirm-fee
- tapOn: "হ্যাঁ, পে(?:য়|য়)েছি"
- extendedWaitUntil:
    visible: "ফি পরিশোধিত"
    timeout: 30000
- takeScreenshot: j16-12-paid
