# যাত্রা ৪ — প্যাথলজি: আমার কাজ, আসা পরীক্ষার অনুরোধ
appId: com.bspc.blood
env:
  J: j4
  ROLE: ডেমো প্যাথলজির মালিক
---
- runFlow: ../common/start.yaml
- tapOn: "আমার কাজ"
- extendedWaitUntil:
    visible: ".*ডেমো সিটি ডা(?:য়|য়)াগনস্টিক সেন্টার.*"
    timeout: 30000
- takeScreenshot: j4-01-my-work
- tapOn: ".*ডেমো সিটি ডা(?:য়|য়)াগনস্টিক সেন্টার.*"
# ২.২৭.০: দুই ট্যাব — শুরুতে "অনুরোধ", "নতুন" ভাগ
- extendedWaitUntil:
    visible: ".*কোড দি(?:য়|য়)ে প্রেসক্রিপশন খুলুন.*"
    timeout: 30000
- takeScreenshot: j4-02-requests-new
- scroll
- takeScreenshot: j4-03-requests-new-more
- tapOn:
    text: "চলছে.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: j4-04-seg-active
- tapOn:
    text: "শেষ.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: j4-04b-seg-reported
# "শেষ"-এ রিপোর্ট দেওয়া আর বাতিল একসাথে — রিপোর্টের "দেখুন" নিচে থাকতে পারে
- scrollUntilVisible:
    element: "দেখুন"
    direction: DOWN
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: "দেখুন"
    commands:
      - tapOn:
          text: "দেখুন"
          index: 0
      - waitForAnimationToEnd:
          timeout: 5000
      - takeScreenshot: j4-05-report-view
      - back
- scrollUntilVisible:
    element: "ল্যাব"
    direction: UP
    timeout: 15000
- tapOn:
    text: "ল্যাব"
    index: 0
- extendedWaitUntil:
    visible: ".*তথ্য বদলান.*"
    timeout: 20000
- takeScreenshot: j4-06-lab-tab
