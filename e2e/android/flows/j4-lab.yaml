# যাত্রা ৪ — প্যাথলজি: আমার কাজ, আসা পরীক্ষার অনুরোধ
appId: com.bspc.blood
env:
  J: j4
  ROLE: ডেমো প্যাথলজির মালিক
---
- runFlow: ../common/start.yaml
- tapOn: "আমার কাজ"
- extendedWaitUntil:
    visible: ".*ডেমো সিটি ডায়াগনস্টিক সেন্টার.*"
    timeout: 30000
- takeScreenshot: j4-01-my-work
- tapOn: ".*ডেমো সিটি ডায়াগনস্টিক সেন্টার.*"
- extendedWaitUntil:
    visible: ".*তথ্য বদলান.*"
    timeout: 30000
- takeScreenshot: j4-02-my-lab
- scrollUntilVisible:
    element: ".*(নমুনা নিয়েছি|রিপোর্ট দিন).*"
    direction: DOWN
    timeout: 30000
    optional: true
- takeScreenshot: j4-03-incoming
- scroll
- takeScreenshot: j4-04-incoming-more
- scrollUntilVisible:
    element: "দেখুন"
    direction: DOWN
    timeout: 20000
    optional: true
- tapOn:
    text: "দেখুন"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: j4-05-report-view
- back
