# যাত্রা ১ — রোগী: হোম, অ্যাপয়েন্টমেন্ট, প্রেসক্রিপশন, উপরের দুই বাটন, ফার্মেসিতে পাঠানো (দোকানে গিয়ে), সফলতার ডায়ালগ, অবস্থা
appId: com.bspc.blood
env:
  J: j1
  ROLE: ডেমো রোগী রহিম
---
- runFlow: ../common/start.yaml
- extendedWaitUntil:
    visible: ".*আমার রিকো(?:য়|য়)েস্ট.*"
    timeout: 30000
    optional: true
- takeScreenshot: j1-01-home
- tapOn: "সেটিংস ও প্রোফাইল"
- scrollUntilVisible:
    element: ".*আমার অ্যাপ(?:য়|য়)েন্টমেন্ট.*"
    direction: DOWN
    timeout: 20000
- takeScreenshot: j1-02-profile
- tapOn: ".*আমার অ্যাপ(?:য়|য়)েন্টমেন্ট.*"
- extendedWaitUntil:
    visible: ".*ডা. ডেমো.*"
    timeout: 30000
    optional: true
- takeScreenshot: j1-03-appointments
- back
- scrollUntilVisible:
    element: ".*আমার প্রেসক্রিপশন.*"
    direction: DOWN
    timeout: 20000
- tapOn: ".*আমার প্রেসক্রিপশন.*"
# চলমান / পূর্বের / সব — একই ডাক্তারের নতুন প্রেসক্রিপশন আগেরটাকে "পূর্বের"-এ পাঠায় (Bislol-এরটা এখন বদলে গেছে);
# তাই চলমান-এর ডায়াবেটিসেরটা (Comet, Rosuva, Ecosprin — demo-svc-rx-d), যেমন একজন রোগী বেছে নেবেন
- extendedWaitUntil:
    visible: "চলমান.*"
    timeout: 30000
- tapOn: "চলমান.*"
- scrollUntilVisible:
    element: ".*Ecosprin.*"
    direction: DOWN
    timeout: 30000
- takeScreenshot: j1-04-rx-list
- tapOn: ".*Ecosprin.*"
# বাটনের লেখা হুবহু "ফার্মেসিতে পাঠান" — সময়রেখার "ফার্মেসিতে পাঠানো — …" (একই ডেমো দিনের আগের চালানো) বা
# "… অন্য ফার্মেসিতে পাঠান" যেন না মেলে (Maestro-র text পুরো লেখার সাথে মেলায়)
- extendedWaitUntil:
    visible: "ফার্মেসিতে পাঠান"
    timeout: 30000
- takeScreenshot: j1-05-rx-top-buttons
# পরীক্ষা লেখা থাকলে তবেই "প্যাথলজিতে পাঠান"
- runFlow:
    when:
      visible: ".*প্যাথলজিতে পাঠান.*"
    commands:
      - tapOn:
          text: ".*প্যাথলজিতে পাঠান.*"
      - extendedWaitUntil:
          visible: "ডেমো .*"
          timeout: 20000
          optional: true
      - takeScreenshot: j1-06-lab-pick
      - back
# উপরের বড় বাটন (নিচের "ওষুধ কেনা" ঘরে একই লেখার আরেকটা বাটন — index 0 = উপরেরটা)
- tapOn:
    text: "ফার্মেসিতে পাঠান"
    index: 0
- extendedWaitUntil:
    visible: ".*দোকানে আছি.*"
    timeout: 10000
- takeScreenshot: j1-07-send-choice
- tapOn: ".*দোকানে আছি.*"
- extendedWaitUntil:
    visible: ".*দোকানের কোড.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: j1-08-shop-mode-pick
- back
- back
- back
# সেবা › ফার্মেসি (তালিকা সাথে সাথে; "দোকানে গিয়ে / অনলাইন অর্ডার" এক জোড়া চিপ) › ডেমো লাইফ ফার্মেসি › বিস্তারিত ›
# নিচের আটকানো বারের "প্রেসক্রিপশন পাঠান" → কোন প্রেসক্রিপশন (চলমান ডায়াবেটিসেরটা, Ecosprin) → "দোকানে পাঠান"
- tapOn: "সেবা"
- tapOn:
    text: "ফার্মেসি"
    index: 0
- extendedWaitUntil:
    visible: "ডেমো .*ফার্মেসি"
    timeout: 30000
# আগের বার "অনলাইন অর্ডার" বাছা থাকলেও দোকানে গিয়ে
- tapOn: "দোকানে গি(?:য়|য়)ে"
- extendedWaitUntil:
    visible: "ডেমো .*ফার্মেসি"
    timeout: 30000
- scrollUntilVisible:
    element: "ডেমো লাইফ ফার্মেসি"
    direction: DOWN
    timeout: 20000
- tapOn: "ডেমো লাইফ ফার্মেসি"
- extendedWaitUntil:
    visible: "মূল তথ্য"
    timeout: 10000
- takeScreenshot: j1-09-pharmacy-sheet
- tapOn: "প্রেসক্রিপশন পাঠান"
# প্রেসক্রিপশন বাছা এখন "প্রেসক্রিপশন পাঠান"-এর ভেতরে (চালু প্রেসক্রিপশন একটা হলে জিজ্ঞেস নয়)
- extendedWaitUntil:
    visible: ".*কোন প্রেসক্রিপশন পাঠাবেন.*|দোকানে পাঠান"
    timeout: 20000
- runFlow:
    when:
      visible: ".*কোন প্রেসক্রিপশন পাঠাবেন.*"
    commands:
      - takeScreenshot: j1-10-which-rx
      - scrollUntilVisible:
          element: ".*Ecosprin.*"
          direction: DOWN
          timeout: 10000
      - tapOn: ".*Ecosprin.*"
# উপায় (দোকানে গিয়ে) উপরের চিপ থেকে — এই দোকানের হিসাব আর "দোকানে পাঠান"
- extendedWaitUntil:
    visible: "দোকানে পাঠান"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: j1-11-send-dialog
- tapOn: "দোকানে পাঠান"
- extendedWaitUntil:
    visible: ".*প্রেসক্রিপশন পাঠানো হ(?:য়|য়)েছে.*"
    timeout: 30000
    optional: true
- takeScreenshot: j1-12-sent-dialog
- tapOn:
    text: ".*প্রেসক্রিপশন খুলুন.*"
    optional: true
- extendedWaitUntil:
    visible: ".*ওষুধ কেনা.*"
    timeout: 30000
    optional: true
- takeScreenshot: j1-13-rx-opened
- scrollUntilVisible:
    element: ".*ডেমো লাইফ ফার্মেসি — .*"
    direction: DOWN
    timeout: 20000
    optional: true
- takeScreenshot: j1-14-rx-status
