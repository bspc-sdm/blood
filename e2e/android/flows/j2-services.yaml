# যাত্রা ২ — সেবা ট্যাব: অ্যাম্বুলেন্স, ডাক্তার, ফার্মেসি, ব্লাড ব্যাংক, ল্যাব — পাঁচ তালিকা একই ছাঁচে, একই বিস্তারিত (নিচে আটকানো বার)
appId: com.bspc.blood
env:
  J: j2
  ROLE: ডেমো রোগী রহিম
---
- runFlow: ../common/start.yaml
- tapOn: "সেবা"
- extendedWaitUntil:
    visible: "ডেমো .*অ্যাম্বুলেন্স.*"
    timeout: 30000
    optional: true
- takeScreenshot: j2-01-ambulance-list
# ২.৩১.০: "অ্যাম্বুলেন্স ডাকুন"-এর শিট — মাঝখানে কি না; "কোথা থেকে নেবে" (এখনকার জায়গা / Google ম্যাপ থেকে / লিখুন — লিংক
# পেস্ট করলে "ম্যাপের জায়গা নেওয়া হয়েছে ✓"); "কোথায় যাবেন" হাসপাতাল/ক্লিনিকের তালিকা (খোঁজা, বাছা)। পাঠানো হয় না — বাতিল।
- tapOn:
    id: "amb_request"
- extendedWaitUntil:
    visible: "কোথা থেকে নেবে"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: j2-01b-amb-sheet
# (ডায়ালগ আলাদা জানালা — সেখানে testTag id হিসেবে আসে না, তাই লেখা দিয়ে)
- tapOn: "লোকেশন লিখুন"
- inputText: "https://maps.google.com/?q=24.0849,90.4248"
- hideKeyboard
- extendedWaitUntil:
    visible: "Google ম্যাপে দেখুন"
    timeout: 15000
- takeScreenshot: j2-01c-amb-map-link
- scrollUntilVisible:
    element: "হাসপাতাল বা ক্লিনিক বেছে নিন.*"
    direction: DOWN
    timeout: 10000
- tapOn: "হাসপাতাল বা ক্লিনিক বেছে নিন.*"
- extendedWaitUntil:
    visible: "হাসপাতাল বা ক্লিনিক খুঁজুন"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*মেডিকেল কলেজ.*"
    timeout: 20000
    optional: true
- takeScreenshot: j2-01d-amb-facilities
- tapOn: "হাসপাতাল বা ক্লিনিক খুঁজুন"
- inputText: "Dhaka Medical"
- hideKeyboard
- extendedWaitUntil:
    visible: "ঢাকা মেডিকেল কলেজ হাসপাতাল"
    timeout: 20000
- takeScreenshot: j2-01e-amb-facility-search
- tapOn: "ঢাকা মেডিকেল কলেজ হাসপাতাল"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: j2-01f-amb-dest-picked
- scroll
- takeScreenshot: j2-01g-amb-sheet-bottom
- tapOn: "বাতিল"
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element: "ডেমো জীবন অ্যাম্বুলেন্স .এসি."
    direction: DOWN
    timeout: 20000
- tapOn: "ডেমো জীবন অ্যাম্বুলেন্স .এসি."
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: j2-02-ambulance-sheet
- scroll
- takeScreenshot: j2-03-ambulance-sheet-bottom
- back
- scrollUntilVisible:
    element: "ডাক্তার"
    direction: UP
    timeout: 10000
# ডাক্তারও "সেবা"-তে (অ্যাপয়েন্টমেন্ট ট্যাবেও আগের মতো)
- tapOn:
    text: "ডাক্তার"
    index: 0
- extendedWaitUntil:
    visible: ".*ডা\\. ডেমো.*"
    timeout: 30000
- takeScreenshot: j2-03b-doctor-list
- scrollUntilVisible:
    element: ".*ডা\\. ডেমো হাসান.*"
    direction: DOWN
    timeout: 20000
- tapOn: ".*ডা\\. ডেমো হাসান.*"
- extendedWaitUntil:
    visible: ".*চেম্বার বেছে অ্যাপ(?:য়|য়)েন্টমেন্ট নিন.*"
    timeout: 30000
- takeScreenshot: j2-03c-doctor-detail
- back
- tapOn:
    text: "ফার্মেসি"
    index: 0
# তালিকা সাথে সাথে — "দোকানে গিয়ে / অনলাইন অর্ডার" এখন এক জোড়া চিপ, তালিকা আটকায় না
- extendedWaitUntil:
    visible: "ডেমো .*ফার্মেসি"
    timeout: 30000
- takeScreenshot: j2-04-pharmacy-list
- scrollUntilVisible:
    element: "ডেমো লাইফ ফার্মেসি"
    direction: DOWN
    timeout: 20000
- tapOn: "ডেমো লাইফ ফার্মেসি"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: j2-05-pharmacy-sheet
- scroll
- takeScreenshot: j2-06-pharmacy-sheet-bottom
- back
# পাঁচ ধরনের চিপ এক সারিতে — "ল্যাব" ডানে ঢাকা থাকলে সারি সরিয়ে
- runFlow:
    when:
      notVisible: "ল্যাব"
    commands:
      - swipe:
          from:
            id: "listing_types"
          direction: LEFT
      - waitForAnimationToEnd:
          timeout: 2000
- tapOn:
    text: "ল্যাব"
    index: 0
- extendedWaitUntil:
    visible: "ডেমো সিটি ডা(?:য়|য়)াগনস্টিক সেন্টার.*"
    timeout: 30000
- takeScreenshot: j2-07-lab-list
- tapOn: "ডেমো সিটি ডা(?:য়|য়)াগনস্টিক সেন্টার.*"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: j2-08-lab-sheet
- scroll
- takeScreenshot: j2-09-lab-sheet-bottom
- back
- tapOn: "ব্লাড ব্যাংক"
- extendedWaitUntil:
    visible: "ডেমো .*ব্লাড.*"
    timeout: 30000
- takeScreenshot: j2-10-bloodbank-list
- tapOn: "ডেমো জীবনধারা ব্লাড ব্যাংক.*"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: j2-11-bloodbank-sheet
- scroll
- takeScreenshot: j2-12-bloodbank-sheet-bottom
- back
