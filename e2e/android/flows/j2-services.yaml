# যাত্রা ২ — সেবা ট্যাব: অ্যাম্বুলেন্স, ফার্মেসি, প্যাথলজি, ব্লাড ব্যাংকের তালিকা আর বিস্তারিত (নিচের বাটন কাটা পড়ে কি না)
appId: com.bspc.blood
env:
  J: j2
  ROLE: ডেমো রোগী রহিম
---
- runFlow: ../common/start.yaml
- tapOn: "সেবা"
- extendedWaitUntil:
    visible: "ডেমো .*অ্যাম্বুলেন্স.*"
    timeout: 30000
    optional: true
- takeScreenshot: j2-01-ambulance-list
# ২.৩১.০: "অ্যাম্বুলেন্স ডাকুন"-এর শিট — মাঝখানে কি না; "কোথা থেকে নেবে" (এখনকার জায়গা / Google ম্যাপ থেকে / লিখুন — লিংক
# পেস্ট করলে "ম্যাপের জায়গা নেওয়া হয়েছে ✓"); "কোথায় যাবেন" হাসপাতাল/ক্লিনিকের তালিকা (খোঁজা, বাছা)। পাঠানো হয় না — বাতিল।
- tapOn:
    id: "amb_request"
- extendedWaitUntil:
    visible:
      id: "amb_location"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: j2-01b-amb-sheet
- tapOn:
    id: "amb_pickup"
- inputText: "https://maps.google.com/?q=24.0849,90.4248"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "amb_map_ok"
    timeout: 15000
    optional: true
- takeScreenshot: j2-01c-amb-map-link
- scrollUntilVisible:
    element:
      id: "amb_dest"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "amb_dest"
- extendedWaitUntil:
    visible:
      id: "fac_list"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*মেডিকেল কলেজ.*"
    timeout: 20000
    optional: true
- takeScreenshot: j2-01d-amb-facilities
- tapOn:
    id: "fac_search"
- inputText: "Dhaka Medical"
- hideKeyboard
- extendedWaitUntil:
    visible: "ঢাকা মেডিকেল কলেজ হাসপাতাল"
    timeout: 20000
- takeScreenshot: j2-01e-amb-facility-search
- tapOn: "ঢাকা মেডিকেল কলেজ হাসপাতাল"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: j2-01f-amb-dest-picked
- scroll
- takeScreenshot: j2-01g-amb-sheet-bottom
- tapOn: "বাতিল"
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element: "ডেমো জীবন অ্যাম্বুলেন্স .এসি."
    direction: DOWN
    timeout: 20000
- tapOn: "ডেমো জীবন অ্যাম্বুলেন্স .এসি."
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: j2-02-ambulance-sheet
- scroll
- takeScreenshot: j2-03-ambulance-sheet-bottom
- back
- scrollUntilVisible:
    element: "ফার্মেসি"
    direction: UP
    timeout: 10000
- tapOn:
    text: "ফার্মেসি"
    index: 0
- extendedWaitUntil:
    visible: "ডেমো .*ফার্মেসি"
    timeout: 30000
- takeScreenshot: j2-04-pharmacy-list
- scrollUntilVisible:
    element: "ডেমো লাইফ ফার্মেসি"
    direction: DOWN
    timeout: 20000
- tapOn: "ডেমো লাইফ ফার্মেসি"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: j2-05-pharmacy-sheet
- scroll
- takeScreenshot: j2-06-pharmacy-sheet-bottom
- back
- tapOn: "প্যাথলজি"
- extendedWaitUntil:
    visible: "ডেমো সিটি ডা(?:য়|য়)াগনস্টিক সেন্টার.*"
    timeout: 30000
- takeScreenshot: j2-07-lab-list
- tapOn: "ডেমো সিটি ডা(?:য়|য়)াগনস্টিক সেন্টার.*"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: j2-08-lab-sheet
- scroll
- takeScreenshot: j2-09-lab-sheet-bottom
- back
- tapOn: "ব্লাড ব্যাংক"
- extendedWaitUntil:
    visible: "ডেমো .*ব্লাড.*"
    timeout: 30000
- takeScreenshot: j2-10-bloodbank-list
- tapOn: "ডেমো জীবনধারা ব্লাড ব্যাংক.*"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: j2-11-bloodbank-sheet
- scroll
- takeScreenshot: j2-12-bloodbank-sheet-bottom
- back
