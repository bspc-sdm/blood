# যাত্রা ৬ — অ্যাম্বুলেন্স: আমার গাড়িগুলো, "এখন খালি আছি" সুইচ (বন্ধ করে আবার চালু — আগের অবস্থায় ফেরত)
appId: com.bspc.blood
env:
  J: j6
  ROLE: ডেমো অ্যাম্বুলেন্স চালক
---
- runFlow: ../common/start.yaml
- tapOn: "আমার কাজ"
- extendedWaitUntil:
    visible: "অ্যাম্বুলেন্স.*"
    timeout: 30000
- takeScreenshot: j6-01-my-work
# ২৪ অক্টোবর ২০২৬: খালি আছি / ট্রিপে আছি একবারই — "আজকের কাজ"-এর অ্যাম্বুলেন্সের ঘরে ("এখন অবস্থা"); গাড়ির পাতায় আর নেই
- extendedWaitUntil:
    visible:
      id: "amb_set_trip"
    timeout: 20000
- takeScreenshot: j6-03-switch-before
- tapOn:
    id: "amb_set_trip"
    index: 0
- extendedWaitUntil:
    visible: "ZZZ-never-shown"
    timeout: 5000
    optional: true
- takeScreenshot: j6-04-switch-toggled
- tapOn:
    id: "amb_set_free"
    index: 0
- extendedWaitUntil:
    visible: "ZZZ-never-shown"
    timeout: 5000
    optional: true
- takeScreenshot: j6-05-switch-restored
- tapOn:
    id: "work_open_ambulance"
- extendedWaitUntil:
    visible: ".*ডেমো জীবন.*"
    timeout: 30000
- takeScreenshot: j6-02-my-ambulances
- scroll
- takeScreenshot: j6-06-more-vehicles
