# যাত্রা ১৯ — রসিদ (ফার্মেসি): প্রেসক্রিপশনের কোড দিয়ে ওষুধ দেওয়া → "হিসাবে তুলুন" → রসিদ (শেয়ার/প্রিন্ট, ১২৩/123),
# তারপর "দোকান › রসিদ": ৭ দিনের তালিকা, বাকি থাকা রসিদ খুলে "বাকি টাকা নিন" (নেওয়া হয় না — শুধু দেখা)।
# ডেমো সার্ভার রোজ কয়েকটা রসিদ বানায় (InvoiceDemo: রহিমের বিক্রি, করিম সাহেবের বাকি, একটা বাতিল)।
appId: com.bspc.blood
env:
  J: j19
  ROLE: ডেমো ফার্মেসির মালিক
---
- runFlow: ../common/start.yaml
- tapOn: "আমার কাজ"
- extendedWaitUntil:
    visible: ".*ডেমো লাইফ ফার্মেসি.*"
    timeout: 30000
- tapOn: ".*ডেমো লাইফ ফার্মেসি.*"
- extendedWaitUntil:
    visible: ".*কোড দি(?:য়|য়)ে প্রেসক্রিপশন খুলুন.*"
    timeout: 30000
# বিক্রি → রসিদ (আগের যাত্রায় সব ওষুধ দেওয়া হয়ে থাকলে এই ভাগ চুপচাপ বাদ)
- tapOn: ".*কোড দি(?:য়|য়)ে প্রেসক্রিপশন খুলুন.*"
- extendedWaitUntil:
    visible: ".*প্রেসক্রিপশনের কোড.*"
    timeout: 10000
- tapOn: ".*প্রেসক্রিপশনের কোড.*"
- inputText: "DEMXRXB333"
- pressKey: Enter
- extendedWaitUntil:
    visible: ".*ওষুধ দিন.*"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: ".*যা দিলাম লিখে রাখুন.*"
    commands:
      - tapOn:
          text: ".*ক(?:য়|য়)টা.*"
          index: 0
          optional: true
      - inputText: "1"
      - hideKeyboard
      - scrollUntilVisible:
          element: ".*যা দিলাম লিখে রাখুন.*"
          direction: DOWN
          timeout: 15000
      - tapOn: ".*যা দিলাম লিখে রাখুন.*"
      - extendedWaitUntil:
          visible: ".*হিসাবে তুলুন.*"
          timeout: 30000
          optional: true
      - scrollUntilVisible:
          element: ".*হিসাবে তুলুন.*"
          direction: DOWN
          timeout: 10000
          optional: true
      - tapOn:
          text: ".*হিসাবে তুলুন.*"
          optional: true
      - extendedWaitUntil:
          visible: ".*PDF শে(?:য়|য়)ার.*"
          timeout: 30000
          optional: true
      - takeScreenshot: j19-01-sale-receipt
- runFlow:
    when:
      visible: ".*PDF শে(?:য়|য়)ার.*"
    commands:
      - tapOn: "123"
      - takeScreenshot: j19-02-sale-receipt-en-digits
      - back
# ওষুধ দেওয়ার ঘর থেকে ফেরা
- runFlow:
    when:
      visible: ".*যা দিলাম লিখে রাখুন.*"
    commands:
      - back
- runFlow:
    when:
      visible: ".*ওষুধ দিন.*"
    commands:
      - back
- runFlow:
    when:
      visible: ".*প্রেসক্রিপশনের কোড.*"
    commands:
      - back
- runFlow:
    when:
      visible: ".*আরেকটা ব্যবসা যোগ করুন.*"
    commands:
      - tapOn: ".*ডেমো লাইফ ফার্মেসি.*"
# দোকান › রসিদ
- extendedWaitUntil:
    visible: ".*কোড দি(?:য়|য়)ে প্রেসক্রিপশন খুলুন.*"
    timeout: 15000
- tapOn:
    text: "দোকান"
    index: 0
# দোকানের ভাগগুলো (তথ্য · বিক্রি · স্টক · এনালাইটিক্স · রসিদ) পাশে সরে — ছোট পর্দায় "রসিদ" ডানে লুকানো থাকে
- extendedWaitUntil:
    visible: "এনালাইটিক্স"
    timeout: 20000
- runFlow:
    when:
      notVisible: "রসিদ"
    commands:
      - swipe:
          from:
            text: "এনালাইটিক্স"
          direction: LEFT
- extendedWaitUntil:
    visible: "রসিদ"
    timeout: 20000
- tapOn: "রসিদ"
- extendedWaitUntil:
    visible: "৭ দিন"
    timeout: 20000
- tapOn: "৭ দিন"
- extendedWaitUntil:
    visible: ".*টা রসিদ.*"
    timeout: 20000
- takeScreenshot: j19-03-receipts-list
- scrollUntilVisible:
    element: ".*করিম সাহেব.*"
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn: ".*করিম সাহেব.*"
- extendedWaitUntil:
    visible: ".*PDF শে(?:য়|য়)ার.*"
    timeout: 20000
- assertVisible: "বাকি"
- takeScreenshot: j19-04-receipt-due
- scrollUntilVisible:
    element: "বাকি টাকা নিন"
    direction: DOWN
    timeout: 10000
- assertVisible: "রসিদ বাতিল"
- takeScreenshot: j19-05-receipt-actions
- tapOn: "রসিদ বাতিল"
- extendedWaitUntil:
    visible: ".*রসিদটা বাতিল করবেন.*"
    timeout: 10000
- assertVisible: "ক্রেতা ফেরত দি(?:য়|য়)েছেন"
- takeScreenshot: j19-06-void-reasons
# বাতিল করা হয় না
- tapOn: "রাখুন"
- back
