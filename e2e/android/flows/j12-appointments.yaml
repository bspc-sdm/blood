# যাত্রা ১২ — অ্যাপয়েন্টমেন্ট আর সিরিয়াল: রোগী ডাক্তারের পাতা থেকে অ্যাপয়েন্টমেন্টের ঘর (BookDialog — পাঠানো নয়),
# আমার অ্যাপয়েন্টমেন্ট (নিশ্চিত হলে আজকের সিরিয়াল, "দেরি হবে" ঘর — পাঠানো নয়); ডাক্তার: আজকের সিরিয়াল, রোগীর তালিকা আর রোগীর ইতিহাস।
appId: com.bspc.blood
env:
  J: j12
  ROLE: ডেমো রোগী রহিম
---
- runFlow: ../common/start.yaml
- tapOn: "অ্যাপ(?:য়|য়)েন্টমেন্ট"
- extendedWaitUntil:
    visible: ".*ডা\\. ডেমো.*"
    timeout: 30000
- scrollUntilVisible:
    element: ".*ডা\\. ডেমো হাসান.*"
    direction: DOWN
    timeout: 20000
- tapOn: ".*ডা\\. ডেমো হাসান.*"
# ডাক্তারের শিট: "চেম্বার বেছে অ্যাপয়েন্টমেন্ট নিন" — চেম্বারের কার্ড চাপলেই BookDialog
- extendedWaitUntil:
    visible: ".*চেম্বার বেছে অ্যাপ(?:য়|য়)েন্টমেন্ট নিন.*"
    timeout: 30000
- takeScreenshot: j12-01-doctor
- tapOn:
    text: ".*কালি(?:য়|য়)াকৈর উপজেলা স্বাস্থ্য কমপ্লেক্স.*"
    index: 0
- extendedWaitUntil:
    visible: ".*কী সমস্যা.*"
    timeout: 20000
- extendedWaitUntil:
    visible: "অনুরোধ পাঠান"
    timeout: 10000
- takeScreenshot: j12-02-book
- tapOn: "বাতিল"
- back
- tapOn: "সেটিংস ও প্রোফাইল"
- scrollUntilVisible:
    element: ".*আমার অ্যাপ(?:য়|য়)েন্টমেন্ট.*"
    direction: DOWN
    timeout: 20000
- tapOn: ".*আমার অ্যাপ(?:য়|য়)েন্টমেন্ট.*"
- extendedWaitUntil:
    visible: "আমার অ্যাপ(?:য়|য়)েন্টমেন্ট"
    timeout: 30000
- takeScreenshot: j12-03-my-appointments
- runFlow:
    when:
      visible: "দেরি হবে"
    commands:
      - tapOn: "দেরি হবে"
      - extendedWaitUntil:
          visible: ".*কত দেরি হবে বেছে নিন.*|.*মিনিট.*"
          timeout: 15000
      - takeScreenshot: j12-04-late
      - tapOn: "বাতিল"
# ডাক্তার
- runFlow:
    file: ../common/start.yaml
    env:
      J: j12d
      ROLE: ডা. ডেমো হাসান
- tapOn: "আমার কাজ"
- tapOn:
    id: "work_open_chamber"
- extendedWaitUntil:
    visible: ".*বুকিং.*"
    timeout: 30000
- extendedWaitUntil:
    visible: ".*আজকের রোগী.*|.*আজ কোনো সিরিয়াল নেই.*"
    timeout: 30000
- takeScreenshot: j12-05-queue
- tapOn: "রোগী"
- extendedWaitUntil:
    visible: ".*ডেমো রোগী.*|.*এখনো কোনো রোগী নেই.*"
    timeout: 30000
- takeScreenshot: j12-06-patients
- runFlow:
    when:
      visible: ".*ডেমো রোগী রহিম.*"
    commands:
      - tapOn:
          text: ".*ডেমো রোগী রহিম.*"
          index: 0
      - waitForAnimationToEnd:
          timeout: 5000
      - takeScreenshot: j12-07-patient-history
