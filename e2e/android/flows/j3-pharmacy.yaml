# যাত্রা ৩ — ফার্মেসি: আমার কাজ, "অর্ডার" ট্যাব (নতুন · চলছে · শেষ), "তৈরি", কোড দিয়ে খুলে ওষুধ দেওয়া, "বিক্রির হিসাবে তুলবেন?", "দোকান" ট্যাব
appId: com.bspc.blood
env:
  J: j3
  ROLE: ডেমো ফার্মেসির মালিক
---
- runFlow: ../common/start.yaml
- tapOn: "আমার কাজ"
- extendedWaitUntil:
    visible: ".*ডেমো লাইফ ফার্মেসি.*"
    timeout: 30000
- takeScreenshot: j3-01-my-work
- tapOn:
    id: "work_open_pharmacy"
# ২.২৭.০: দুই ট্যাব — শুরুতে "অর্ডার", "নতুন" ভাগ
- extendedWaitUntil:
    visible: ".*কোড দি(?:য়|য়)ে প্রেসক্রিপশন খুলুন.*"
    timeout: 30000
- takeScreenshot: j3-02-orders-new
- scrollUntilVisible:
    element: "দোকানে এসেছেন"
    direction: DOWN
    timeout: 20000
    centerElement: true
    optional: true
- takeScreenshot: j3-03-shop-order
# ২৪ অক্টোবর ২০২৬ (আমার কাজের নতুন সাজ): সারিতে একটাই মূল বাটন ("খুলুন"); "তৈরি" "আরও"-র ভেতরে
- tapOn:
    text: "আরও"
    below: "দোকানে এসেছেন"
    optional: true
- takeScreenshot: j3-03b-row-more
- tapOn:
    text: "তৈরি"
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: j3-04-marked-ready
- scrollUntilVisible:
    element: "চলছে.*"
    direction: UP
    timeout: 15000
    optional: true
- tapOn:
    text: "চলছে.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: j3-05-seg-active
- tapOn:
    text: "শেষ"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: j3-05b-seg-closed
# প্রেসক্রিপশনের কোড দিয়ে খোলা (রহিমের DEMXRXB333) — ১টা Comet দেওয়া
- scrollUntilVisible:
    element: ".*কোড দি(?:য়|য়)ে প্রেসক্রিপশন খুলুন.*"
    direction: UP
    timeout: 15000
- tapOn: ".*কোড দি(?:য়|য়)ে প্রেসক্রিপশন খুলুন.*"
- extendedWaitUntil:
    visible: ".*প্রেসক্রিপশনের কোড.*"
    timeout: 10000
- takeScreenshot: j3-05c-code-dialog
- tapOn: ".*প্রেসক্রিপশনের কোড.*"
- inputText: "DEMXRXB333"
# কিবোর্ডের "Go" (Enter) চাপলেই খোলে — আলাদা "খুলুন" লাগে না
- pressKey: Enter
- extendedWaitUntil:
    visible: ".*ওষুধ দিন.*"
    timeout: 30000
- takeScreenshot: j3-06-dispense-open
- tapOn:
    text: ".*ক(?:য়|য়)টা.*"
    index: 0
- inputText: "1"
- hideKeyboard
- scrollUntilVisible:
    element: ".*যা দিলাম লিখে রাখুন.*"
    direction: DOWN
    timeout: 15000
- takeScreenshot: j3-07-dispense-filled
- tapOn: ".*যা দিলাম লিখে রাখুন.*"
- extendedWaitUntil:
    visible: ".*বিক্রির হিসাবে তুলবেন.*"
    timeout: 30000
    optional: true
- scrollUntilVisible:
    element: ".*এখন না.*"
    direction: DOWN
    timeout: 10000
    optional: true
- takeScreenshot: j3-08-sale-offer
- tapOn:
    text: ".*এখন না.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: j3-09-after-not-now
# "দোকান" ট্যাব: তথ্য, QR, বন্ধ রাখা, বিক্রি ও স্টক, ওষুধ খোঁজার অনুরোধ, একদম নিচে মুছে ফেলা
# "ওষুধ দিন" থেকে ফেরা (কিবোর্ড খোলা থাকলে প্রথম back সেটাই বন্ধ করে); বেশি ফিরে "আমার কাজ"-এ গেলে আবার ফার্মেসি
- back
- runFlow:
    when:
      visible: ".*যা দিলাম লিখে রাখুন.*"
    commands:
      - back
- runFlow:
    when:
      visible:
        id: "work_home"
    commands:
      - tapOn:
          id: "work_open_pharmacy"
- extendedWaitUntil:
    visible: ".*কোড দি(?:য়|য়)ে প্রেসক্রিপশন খুলুন.*"
    timeout: 15000
- tapOn:
    text: "দোকান"
    index: 0
- extendedWaitUntil:
    visible: ".*তথ্য বদলান.*"
    timeout: 20000
- takeScreenshot: j3-10-shop-tab
- scroll
- takeScreenshot: j3-11-shop-more
- scrollUntilVisible:
    element: ".*ফার্মেসি মুছে ফেলুন.*"
    direction: DOWN
    timeout: 20000
    optional: true
- takeScreenshot: j3-12-shop-bottom
# ২৪ অক্টোবর ২০২৬: ওপরের ট্যাব অর্ডার · বিক্রি · দোকান (তৃতীয় স্তর নেই) — "বিক্রি"-তে কাউন্টারের নতুন বিক্রি,
# আজ/সপ্তাহের বিক্রি, "দোকানের হিসাব" (পুরো পর্দা); ওষুধ খোঁজার অনুরোধ "অর্ডার"-এর ওপরে এক লাইনে
- tapOn:
    text: "বিক্রি"
    index: 0
- extendedWaitUntil:
    visible: "নতুন বিক্রি"
    timeout: 20000
- takeScreenshot: j3-13-sales-tab
- scrollUntilVisible:
    element: "দোকানের হিসাব"
    direction: DOWN
    timeout: 20000
    optional: true
- takeScreenshot: j3-13b-sales-bottom
- tapOn:
    text: "দোকানের হিসাব"
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: j3-13c-shop-accounts
- runFlow:
    when:
      visible: "গত ৭ দিন"
    commands:
      - back
- tapOn:
    text: "অর্ডার.*"
    index: 0
- extendedWaitUntil:
    visible: ".*ওষুধ খোঁজার অনুরোধ.*"
    timeout: 20000
- tapOn: ".*ওষুধ খোঁজার অনুরোধ.*"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: j3-14-medicine-requests
