name: Web e2e (Vue web + Spring)

# The web e2e journeys (e2e/web, Playwright) on the Vue web (web-vue/: /w/ = web, /admin = admin panel, built against the
# Auth emulator) and the Kotlin/Spring backend started inside the runner — what people actually use, with no production
# access: PostgreSQL 16 + Redis 7 service containers, a fresh database (Flyway on start), the Firebase Auth emulator
# (Spring reaches it through FIREBASE_AUTH_EMULATOR_HOST with a throw-away service account, e2e/spring.sh), push faked
# (PUSH_MODE=fake; every push is also written to the bell list, which journey 11 checks per notification type), login
# codes read from Spring's log (SES off). The front (e2e/server/spring-front.js) serves the pages with production's CSP.
# Journey 00 seeds the demo through the admin panel. The retired React web can still be run for comparison
# (input web=react); the Node server baseline only by hand (node_baseline).
# Whole machine clock → 11:00 Dhaka during the run (the journeys were written for that hour; Spring, PostgreSQL, the
# emulator and Chrome must agree on the time), restored afterwards.
# Result → log branch (like backend.yml): spring → spring-ci-log, X → ci-log-X: e2e-status.txt, e2e/summary.md,
# e2e/<spring|node>/ (report-*.json|md, shots-*/ = screenshots of failed steps, run/stack logs, spring-errors.log).
# চলে: main-এ push (শুধু backend/src, web-vue, e2e/web|server বদলালে), হাতে (Run workflow), আর সপ্তাহে একবার
# (শনিবার ২১:৪৭ UTC = রবিবার ভোর ৩:৪৭ ঢাকা, main) — শুধু যদি গত ৭ দিনে backend/, web-vue/ বা e2e/ বদলেছে।
on:
  push:
    branches: [main]
    paths:
      - "backend/src/main/**"
      - "web-vue/src/**"
      - "web-vue/admin/**"
      - "e2e/web/**"
      - "e2e/server/**"
      - "e2e/spring.sh"
      - ".github/workflows/backend-e2e.yml"
  schedule:
    - cron: "47 21 * * 6"
  workflow_dispatch:
    inputs:
      only:
        description: "Only these journeys (e.g. '00 02'); empty = all"
        required: false
        default: ""
      clock:
        description: "Dhaka time of day for the run (HH:MM) or 'real'"
        required: false
        default: "11:00"
      web:
        description: "Which web: vue (what people use) or react (retired, comparison only)"
        required: false
        default: "vue"
      node_baseline:
        description: "Also run the journeys against the Node server (off by default: Vercel/Firestore are being retired)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: backend-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # সপ্তাহের চালানো: গত ৭ দিনে কিছু না বদলালে বাকিটা বাদ (কয়েক সেকেন্ড)
  changed:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - id: c
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != schedule ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          n=$(git log --since='7 days ago' --format=%H -- backend e2e web-vue .github/workflows/backend-e2e.yml | wc -l)
          echo "commits in 7 days: $n"
          echo "run=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  e2e:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    name: e2e (${{ matrix.backend }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(inputs.node_baseline && '["spring","node"]' || '["spring"]') }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lifolo
          POSTGRES_PASSWORD: lifolo
          POSTGRES_DB: lifolo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lifolo" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SKIP: ${{ matrix.backend == 'node' && github.event_name == 'workflow_dispatch' && !inputs.node_baseline }}
      E2E_ONLY: ${{ inputs.only }}
      E2E_WANT_CLOCK: ${{ inputs.clock || '11:00' }}
      LABEL: ${{ matrix.backend }}
      E2E_WEB: ${{ inputs.web || 'vue' }}
    steps:
      - uses: actions/checkout@v5
        if: env.SKIP != 'true'

      - uses: actions/setup-java@v4
        if: env.SKIP != 'true' && matrix.backend == 'spring'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        if: env.SKIP != 'true' && matrix.backend == 'spring'

      - name: Build the boot jar
        if: env.SKIP != 'true' && matrix.backend == 'spring'
        working-directory: backend
        run: |
          ./gradlew bootJar --no-daemon -q
          ls -l build/libs/
          for j in build/libs/*.jar; do case "$j" in *-plain.jar) ;; *) cp "$j" "$RUNNER_TEMP/app.jar" ;; esac; done

      - uses: actions/setup-node@v5
        if: env.SKIP != 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            web-vue/package-lock.json
            web/package-lock.json
            server/package-lock.json

      - name: Install (e2e tools, web, Chromium)
        if: env.SKIP != 'true'
        run: |
          (cd e2e && npm ci --no-audit --no-fund)
          if [ "$E2E_WEB" = react ]; then (cd web && npm ci --no-audit --no-fund); else (cd web-vue && npm ci --no-audit --no-fund); fi
          if [ "$LABEL" = node ]; then (cd server && npm ci --no-audit --no-fund); fi
          # Chromium 141 (Playwright 1.56's build, the one the journeys were written with; playwright-core 1.49 drives it).
          # The 1.49 build (Chromium 131) did not keep the admin panel's __Host- cookie on http://localhost.
          npx -y playwright@1.56.1 install --with-deps chromium
          chrome="$(find "$HOME/.cache/ms-playwright" -path '*/chromium-*/chrome-linux*/chrome' -type f | sort -V | tail -1)"
          "$chrome" --version
          echo "CHROME=$chrome" >> "$GITHUB_ENV"

      - name: Build the web app and the admin panel (Auth emulator build)
        if: env.SKIP != 'true'
        run: |
          node --input-type=module -e "const m = await import('./e2e/web/stack.mjs'); m.buildWeb({ force: true });"

      - name: Clock → ${{ env.E2E_WANT_CLOCK }} Dhaka
        if: env.SKIP != 'true' && env.E2E_WANT_CLOCK != 'real'
        run: |
          sudo timedatectl set-ntp false 2>/dev/null || true
          for s in chrony chronyd systemd-timesyncd ntp ntpsec; do sudo systemctl stop "$s" 2>/dev/null || true; done
          now=$(date +%s)
          h=${E2E_WANT_CLOCK%%:*}; m=${E2E_WANT_CLOCK##*:}
          day=$(( (now + 21600) / 86400 * 86400 - 21600 ))
          target=$(( day + 10#$h * 3600 + 10#$m * 60 ))
          shift=$(( target - now ))
          sudo date -s "@$target" >/dev/null
          echo "CLOCK_SHIFT=$shift" >> "$GITHUB_ENV"
          echo "clock moved by ${shift}s → $(TZ=Asia/Dhaka date)"

      - name: Start Spring
        if: env.SKIP != 'true' && matrix.backend == 'spring'
        run: bash e2e/spring.sh "$RUNNER_TEMP/app.jar" "$RUNNER_TEMP/spring.log"

      - name: Run the journeys
        if: env.SKIP != 'true'
        timeout-minutes: 55
        run: |
          if [ "$LABEL" = spring ]; then export E2E_BACKEND=http://127.0.0.1:8080 E2E_BACKEND_LOG="$RUNNER_TEMP/spring.log"; fi
          # the machine clock is already at the wanted hour
          export E2E_CLOCK=real E2E_TRACE=1
          # shellcheck disable=SC2086
          node e2e/web/run.mjs $E2E_ONLY 2>&1 | tee "$RUNNER_TEMP/run.log" || true

      - name: Report
        if: always() && env.SKIP != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          node e2e/web/report.mjs "$LABEL" "$RUNNER_TEMP/report" "$RUNNER_TEMP/spring.log" || true
          cp e2e/.build/stack.log "$RUNNER_TEMP/report/stack-$LABEL.log" 2>/dev/null || true
          tail -c 400000 "$RUNNER_TEMP/run.log" > "$RUNNER_TEMP/report/run-$LABEL.log" 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/spring.log" ]; then
            grep -n -E 'ERROR|WARN|Exception|^\s+at com\.lifolo' "$RUNNER_TEMP/spring.log" | grep -v 'SES not configured' | head -3000 > "$RUNNER_TEMP/report/spring-errors.log" || true
            tail -c 300000 "$RUNNER_TEMP/spring.log" | grep -v 'Subject: আপনার লগইন কোড' > "$RUNNER_TEMP/report/spring-tail.log" || true
          fi
          cat "$RUNNER_TEMP/report/report-$LABEL.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Restore the clock
        if: always() && env.CLOCK_SHIFT != ''
        run: |
          sudo date -s "@$(( $(date +%s) - CLOCK_SHIFT ))" >/dev/null
          sudo timedatectl set-ntp true 2>/dev/null || true
          for s in chrony systemd-timesyncd; do sudo systemctl start "$s" 2>/dev/null || true; done
          date -u

      - uses: actions/upload-artifact@v4
        if: always() && env.SKIP != 'true'
        with:
          name: report-${{ matrix.backend }}
          path: ${{ runner.temp }}/report
          retention-days: 7

      # this leg's files → log branch right away (e2e/<backend>/), the publish job adds summary.md + e2e-status.txt
      - name: Publish this leg to the log branch
        if: always() && env.SKIP != 'true' && github.event_name != 'pull_request'
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          LOG_MESSAGE: backend e2e ${{ matrix.backend }} ${{ github.sha }}
        run: |
          if [ "$BRANCH" = "spring" ]; then LOG_BRANCH=spring-ci-log; else LOG_BRANCH="ci-log-${BRANCH//\//-}"; fi
          mkdir -p "$RUNNER_TEMP/legout/e2e/$LABEL"
          cp -R "$RUNNER_TEMP/report"/. "$RUNNER_TEMP/legout/e2e/$LABEL/" 2>/dev/null || true
          echo "${GITHUB_SHA} ${LABEL} $(head -3 "$RUNNER_TEMP/report/report-$LABEL.md" 2>/dev/null | tail -1)" > "$RUNNER_TEMP/legout/e2e/$LABEL/status.txt"
          bash .github/scripts/publish-log.sh "$LOG_BRANCH" "$RUNNER_TEMP/legout" "e2e/$LABEL"


  publish:
    needs: [changed, e2e]
    if: always() && needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/in
      - name: Summary (Spring vs Node)
        env:
          BRANCH: ${{ github.ref_name }}
          RESULT: ${{ needs.e2e.result }}
        run: |
          mkdir -p "$RUNNER_TEMP/out/e2e"
          node - <<'JS' > "$RUNNER_TEMP/out/e2e/summary.md"
          const fs = require('fs');
          const dir = process.env.RUNNER_TEMP + '/in';
          const load = (l) => { try { return JSON.parse(fs.readFileSync(`${dir}/report-${l}/report-${l}.json`, 'utf8')); } catch { return null; } };
          const s = load('spring'), n = load('node');
          const line = (r, l) => r ? `${l}: ${r.green ? '✅' : '❌'} scenarios ${r.totals.scenariosOk}/${r.totals.scenarios}, stopped journeys ${r.totals.stopped}, bug steps ${r.totals.bugSteps}, API 5xx ${r.totals.api5xx}, server errors ${r.totals.serverErrors}` : `${l}: (no report)`;
          const out = [`# Web e2e — ${process.env.BRANCH} ${process.env.GITHUB_SHA}`, '', line(s, 'spring'), line(n, 'node'), ''];
          // verdict: with the Node baseline, Spring passes when it fails nothing that Node passes (same scenarios, no
          // extra bug steps / API errors / 5xx / server errors); without it, Spring must be fully green.
          let pass = !!s && s.totals.api5xx === 0 && s.totals.serverErrors === 0;
          if (s && !n) pass = pass && s.green;
          if (s && n) {
            const key = (r) => new Map(r.journeys.flatMap((j) => j.failedScenarios.map((x) => [`${j.journey} ${x.id}`, x.msg || ''])));
            const sf = key(s), nf = key(n);
            const onlyS = [...sf].filter(([k]) => !nf.has(k)), both = [...sf].filter(([k]) => nf.has(k)), onlyN = [...nf].filter(([k]) => !sf.has(k));
            out.push('## Parity', '', `Failing only on Spring: ${onlyS.length} · on both: ${both.length} · only on Node: ${onlyN.length}`, '');
            if (onlyS.length) out.push('### Only on Spring', '', ...onlyS.map(([k, m]) => `- ${k}: ${m}`), '');
            if (both.length) out.push('### On both', '', ...both.map(([k, m]) => `- ${k}: ${m}`), '');
            if (onlyN.length) out.push('### Only on Node', '', ...onlyN.map(([k, m]) => `- ${k}: ${m}`), '');
            const bugKeys = (r) => new Set(r.journeys.flatMap((j) => j.bugSteps.map((b) => `${j.journey} ${b.title}`)));
            const sb = bugKeys(s), nb = bugKeys(n);
            const bugOnlyS = [...sb].filter((k) => !nb.has(k));
            if (bugOnlyS.length) out.push('### Bug steps only on Spring', '', ...bugOnlyS.map((k) => `- ${k}`), '');
            const apiOnlyS = Object.entries(s.apiErrors).filter(([k, c]) => (n.apiErrors[k] || 0) < c);
            const apiOnlyN = Object.entries(n.apiErrors).filter(([k, c]) => (s.apiErrors[k] || 0) < c);
            out.push(`API 4xx/5xx: same on both: ${apiOnlyS.length || apiOnlyN.length ? 'no' : 'yes'}`, '');
            if (apiOnlyS.length) out.push('### API errors more often on Spring', '', ...apiOnlyS.map(([k, c]) => `- ${c}× (node ${n.apiErrors[k] || 0}×) ${k}`), '');
            if (apiOnlyN.length) out.push('### API errors more often on Node', '', ...apiOnlyN.map(([k, c]) => `- ${c}× (spring ${s.apiErrors[k] || 0}×) ${k}`), '');
            pass = pass && !onlyS.length && !bugOnlyS.length && !apiOnlyS.length && s.totals.stopped <= n.totals.stopped;
            out.push('| journey | spring | node |', '|---|---|---|');
            for (const j of s.journeys) {
              const o = n.journeys.find((x) => x.journey === j.journey);
              const c = (x) => x ? `${x.scenariosOk}/${x.scenarios}${x.stopped ? ' (stopped)' : ''}${x.bugSteps.length ? `, ${x.bugSteps.length} bug` : ''}` : '—';
              out.push(`| ${j.journey} | ${c(j)} | ${c(o)} |`);
            }
          }
          out.splice(4, 0, `verdict: ${pass ? 'PASS' : 'FAIL'} (${n ? 'parity with the Node baseline' : 'no baseline: Spring must be fully green'})`, '');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/verdict', pass ? 'success' : 'failure');
          console.log(out.join('\n'));
          JS
          cat "$RUNNER_TEMP/out/e2e/summary.md" >> "$GITHUB_STEP_SUMMARY"
          st="$(cat "$RUNNER_TEMP/verdict" 2>/dev/null || echo failure)"
          [ "$RESULT" = success ] || st=failure
          echo "${GITHUB_SHA} ${st} ${BRANCH} $(sed -n '3,5p' "$RUNNER_TEMP/out/e2e/summary.md" | tr '\n' ' ')" > "$RUNNER_TEMP/out/e2e-status.txt"
          cat "$RUNNER_TEMP/out/e2e-status.txt"
          echo "verdict=$st" >> "$GITHUB_ENV"
      - name: Publish to the log branch
        if: github.event_name != 'pull_request'
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          LOG_MESSAGE: backend e2e ${{ github.sha }}
        run: |
          if [ "$BRANCH" = "spring" ]; then LOG_BRANCH=spring-ci-log; else LOG_BRANCH="ci-log-${BRANCH//\//-}"; fi
          bash .github/scripts/publish-log.sh "$LOG_BRANCH" "$RUNNER_TEMP/out" e2e-status.txt e2e/summary.md e2e/report-spring.json e2e/report-spring.md e2e/report-node.json e2e/report-node.md e2e/shots-spring e2e/shots-node e2e/run-spring.log e2e/run-node.log e2e/stack-spring.log e2e/stack-node.log e2e/spring-errors.log e2e/spring-tail.log
      - name: Verdict
        run: |
          echo "e2e verdict: $verdict"
          [ "$verdict" = success ]
