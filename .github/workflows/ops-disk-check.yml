name: "Ops: disk and RAM check"

# ডিস্ক/RAM আর লগ ঘোরানো — শুধু দেখা, কিছু বদলায় না: df/inode, free, কে কত RAM নেয়, কোন ফোল্ডারে কত জায়গা,
# ডাটাবেস আর ব্যাকআপের আকার, journald-এর সীমা, logrotate (nginx, postgres, redis …) আর অ্যাপের লগ কোথায় যায়।
# সতর্কতার সীমার পরামর্শ: deploy/OPS-DRILLS.md। ফল log branch `ci-log-ops-drills`-এ: disk/summary.md।
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ops-disk
  cancel-in-progress: false

jobs:
  disk:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ip="$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')"
          [[ "$ip" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]] || { echo "::error::VPS_HOST-এ IP নেই"; exit 1; }
          echo "::add-mask::$ip"; echo "::add-mask::${ip//./-}"
          echo "ORIGIN_IP=$ip" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/out"

      - name: Connect to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_ROOT_PASSWORD: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: bash deploy/ci/vps-connect.sh

      - name: Disk, RAM, log rotation
        run: |
          out="$RUNNER_TEMP/out"
          ssh vps "install -d -m 0700 /root/lifolo-ops && cat > /root/lifolo-ops/vps-ops.sh" < deploy/ops/vps-ops.sh
          ssh vps "bash /root/lifolo-ops/vps-ops.sh disk" > "$out/disk.md"
          ssh vps "df -P / | awk 'NR==2{print \"disk_used_pct=\" \$5+0}'; df -Pi / | awk 'NR==2{print \"inode_used_pct=\" \$5+0}'; \
                   awk '/MemTotal/{t=\$2}/MemAvailable/{a=\$2}/SwapTotal/{st=\$2}/SwapFree/{sf=\$2}END{printf \"mem_avail_pct=%d\nswap_used_mb=%d\n\", 100*a/t, (st-sf)/1024}' /proc/meminfo; \
                   echo journal_mb=\$(du -sm /var/log/journal 2>/dev/null | cut -f1); echo varlog_mb=\$(du -sm /var/log 2>/dev/null | cut -f1)" > "$out/status.txt"
          cat "$out/status.txt"

      - name: Summary
        if: always()
        run: |
          out="$RUNNER_TEMP/out"
          g() { sed -nE "s/^$1=(.*)$/\1/p" "$out/status.txt" 2>/dev/null | tail -1; }
          lvl() { # $1 value, $2 warn, $3 crit (বড় = খারাপ)
            [ -n "$1" ] || { echo "?"; return; }
            if [ "$1" -ge "$3" ]; then echo "🔴"; elif [ "$1" -ge "$2" ]; then echo "🟡"; else echo "🟢"; fi
          }
          du="$(g disk_used_pct)"; iu="$(g inode_used_pct)"; ma="$(g mem_avail_pct)"; sw="$(g swap_used_mb)"
          {
            echo "## ডিস্ক / RAM / লগ"
            echo
            echo "| মাপ | এখন | অবস্থা (প্রস্তাবিত সীমা) |"
            echo "|---|---|---|"
            echo "| ডিস্ক (/) ব্যবহৃত | ${du:-?}% | $(lvl "$du" 80 90) (সতর্ক ৮০%, জরুরি ৯০%) |"
            echo "| inode ব্যবহৃত | ${iu:-?}% | $(lvl "$iu" 80 90) (৮০% / ৯০%) |"
            echo "| খালি RAM (MemAvailable) | ${ma:-?}% | $( [ -n "$ma" ] && lvl $((100 - ma)) 85 95 || echo '?') (খালি <১৫% সতর্ক, <৫% জরুরি) |"
            echo "| swap ব্যবহৃত | ${sw:-?} MB | $(lvl "$sw" 512 1500) (৫১২ MB সতর্ক, ১.৫ GB জরুরি) |"
            echo "| journald | $(g journal_mb) MB | /var/log মোট $(g varlog_mb) MB |"
            echo
            cat "$out/disk.md" 2>/dev/null
            echo
            echo "_run ${{ github.run_id }} · গাইড ও পরামর্শ: deploy/OPS-DRILLS.md_"
          } > "$out/summary.md"
          ip_re="${ORIGIN_IP//./\\.}"; dash_re="${ORIGIN_IP//./-}"
          for f in "$out"/*; do [ -f "$f" ] && sed -i -e "s/$ip_re/<vps-ip>/g" -e "s/$dash_re/<vps-ip>/g" "$f"; done
          cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to the log branch (ci-log-ops-drills)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          LOG_MESSAGE: ops disk check ${{ github.run_id }} ${{ job.status }}
        run: |
          src="$RUNNER_TEMP/log"; rm -rf "$src"; mkdir -p "$src/disk"
          cp "$RUNNER_TEMP/out/summary.md" "$src/disk/summary.md" 2>/dev/null || true
          { echo "run=${GITHUB_RUN_ID}"; echo "job=${{ job.status }}"; cat "$RUNNER_TEMP/out/status.txt" 2>/dev/null || true; } > "$src/disk/status.txt"
          bash .github/scripts/publish-log.sh ci-log-ops-drills "$src" disk

      - name: Clean up
        if: always()
        run: |
          ssh -O exit vps 2>/dev/null || true
          rm -rf ~/.ssh/lifolo ~/.ssh/config
