name: "Ops: restart drill"

# রিবুট মহড়া — VPS আসলেই রিবুট করা হয় (কয়েক মিনিট সাইট বন্ধ!)। তারপর মাপা: কত সেকেন্ডে https-এর /api/health আবার
# সবুজ, আর সব সার্ভিস (api, nginx, postgres, redis, timer) নিজে নিজে চালু হলো কি না।
# হাতে চালানো: Actions → "Ops: restart drill" → Run workflow → "REBOOT" লিখে। বাংলা গাইড: deploy/OPS-DRILLS.md।
# ফল log branch `ci-log-ops-drills`-এ: restart/summary.md, restart/status.txt।
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "সত্যিই রিবুট? REBOOT লিখুন"
        type: string
        default: ""
      log_branch:
        description: "ফল কোন log branch-এ"
        type: string
        default: "ci-log-ops-drills"

permissions:
  contents: write

concurrency:
  group: vps-admin
  cancel-in-progress: false

jobs:
  reboot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      API_DOMAIN: api.lifolo.com
      WEB_DOMAIN: lifolo.com
    steps:
      - uses: actions/checkout@v5

      - name: Check input and secrets
        env:
          CONFIRM: ${{ inputs.confirm }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          [ "$CONFIRM" = REBOOT ] || { echo "::error::confirm-এ REBOOT লিখে চালান (VPS রিবুট হবে)"; exit 1; }
          ip="$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')"
          [[ "$ip" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]] || { echo "::error::VPS_HOST-এ IP নেই"; exit 1; }
          echo "::add-mask::$ip"; echo "::add-mask::${ip//./-}"
          echo "ORIGIN_IP=$ip" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/out"

      - name: Connect to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_ROOT_PASSWORD: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: bash deploy/ci/vps-connect.sh

      # origin শুধু Cloudflare-এর জন্য খোলা; রিবুটে ssh tunnel ছিঁড়ে যায়, তাই এই মেশিনের ঠিকানার জন্য সাময়িক ছিদ্র
      # (ufw-এর নিয়ম রিবুটেও থাকে; ৪০ মিনিট পরে VPS নিজে বন্ধ করে, শেষ ধাপে এখনই বন্ধ)
      - name: Origin - temporary hole for this runner
        run: bash deploy/ci/origin-access.sh open 40

      - name: Before
        run: |
          ssh vps "install -d -m 0700 /root/lifolo-ops && cat > /root/lifolo-ops/.vps-ops.sh.\$\$ && mv /root/lifolo-ops/.vps-ops.sh.\$\$ /root/lifolo-ops/vps-ops.sh" < deploy/ops/vps-ops.sh
          ssh vps "bash /root/lifolo-ops/vps-ops.sh services" | tee "$RUNNER_TEMP/out/before.txt"
          ssh vps "/usr/local/sbin/lifolo-tune status 2>/dev/null || true" | tee "$RUNNER_TEMP/out/tune-before.txt"
          curl -fsS -m 15 --resolve "$API_DOMAIN:443:$ORIGIN_IP" "https://$API_DOMAIN/api/health" | grep -q '"ok":true' \
            || { echo "::error::রিবুটের আগেই /api/health সবুজ নয় — মহড়া বাতিল"; exit 1; }

      - name: Reboot and measure
        id: drill
        run: |
          out="$RUNNER_TEMP/out"
          H() { curl -fsS -m 3 --connect-timeout 2 --resolve "$API_DOMAIN:443:$ORIGIN_IP" "https://$API_DOMAIN/api/health" 2>/dev/null | grep -q '"ok":true'; }
          echo "rebooted_at=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" | tee "$out/drill.txt"
          t0=$(date +%s.%N)
          # Uptime-এর সতর্কতা এই রিবুটকে "মহড়া" ধরে (অপ্রত্যাশিত নয়)
          ssh vps 'install -d -m 0755 /var/lib/lifolo && date +%s >> /var/lib/lifolo/ops-expected'
          # ২ সেকেন্ড পরে রিবুট (ssh ঠিকভাবে ফেরে)
          ssh vps "systemd-run --on-active=2 --unit=lifolo-ops-reboot /bin/systemctl reboot" || true
          ssh -O exit vps 2>/dev/null || true
          down="" ssh_gone="" ssh_up="" green="" pub="" down_body=""
          el() { awk -v a="$(date +%s.%N)" -v b="$t0" 'BEGIN{printf "%.1f", a-b}'; }
          for _ in $(seq 1 600); do
            if [ -z "$down" ]; then
              H || down="$(el)"
            else
              # পোর্ট 22: আগে বন্ধ হওয়া দেখা, তারপর আবার খোলা (বন্ধ হওয়ার আগের খোলা গোনা নয়)
              if timeout 1 bash -c "</dev/tcp/$ORIGIN_IP/22" 2>/dev/null; then
                [ -z "$ssh_gone" ] || [ -n "$ssh_up" ] || ssh_up="$(el)"
              else
                [ -n "$ssh_gone" ] || ssh_gone="$(el)"
              fi
              if H; then green="$(el)"; break; fi
              # Spring চালু হওয়ার আগে nginx যা দেয়: JSON (অ্যাপ বার্তা দেখায়) না HTML
              if [ -z "$down_body" ]; then
                c="$(curl -s -m 3 --connect-timeout 2 -o "$out/probe.txt" -w '%{http_code}' --resolve "$API_DOMAIN:443:$ORIGIN_IP" "https://$API_DOMAIN/api/health" 2>/dev/null || true)"
                if [[ "$c" =~ ^50[234]$ ]]; then down_body="$(grep -q '"code":"server_unavailable"' "$out/probe.txt" && echo "JSON ($c)" || echo "HTML/অন্য ($c)")"; fi
              fi
            fi
            sleep 1
            # ১০ মিনিট পর হাল ছাড়া
            [ "$(awk -v a="$(date +%s.%N)" -v b="$t0" 'BEGIN{print (a-b > 600)}')" = 1 ] && break
          done
          # Cloudflare দিয়ে (আসল ব্যবহারকারীর পথ) — challenge হলে সেটা লেখা
          if [ -n "$green" ]; then
            for _ in $(seq 1 30); do
              code="$(curl -s -m 10 -o "$out/pub.txt" -w '%{http_code}' "https://$WEB_DOMAIN/api/health" || echo 000)"
              if [ "$code" = 200 ] && grep -q '"ok":true' "$out/pub.txt"; then pub="ok $(el)"; break; fi
              if [ "$code" = 403 ] || [ "$code" = 429 ]; then pub="cloudflare_challenge (HTTP $code)"; break; fi
              sleep 2
            done
          fi
          {
            echo "down_after_s=${down:-never}"
            echo "ssh_up_s=${ssh_up:-?}"
            echo "health_green_s=${green:-timeout}"
            echo "public_via_cloudflare=${pub:-not ok}"
            echo "down_body=${down_body:-দেখা যায়নি}"
          } | tee -a "$out/drill.txt"
          [ -n "$green" ] || { echo "::error::১০ মিনিটেও /api/health সবুজ হয়নি"; exit 1; }

      - name: After - services came back by themselves?
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_ROOT_PASSWORD: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: |
          out="$RUNNER_TEMP/out"
          for _ in 1 2 3 4 5 6; do bash deploy/ci/vps-connect.sh && break; sleep 10; done
          # timer আর JobRunr-এর প্রথম কাজ চলার সময় দেওয়া
          sleep 75
          ssh vps "bash /root/lifolo-ops/vps-ops.sh services" | tee "$out/after.txt"
          # নতুন সেটিং রিবুটের পরেও (JVM, PostgreSQL, Redis, nginx, ufw)
          ssh vps "/usr/local/sbin/lifolo-tune status 2>/dev/null || true" | tee "$out/tune-after.txt"
          ssh vps "journalctl -b -u 'lifolo-api*' --no-pager -o short-iso | grep -E 'Started Lifolo|Started [A-Za-z]+ in|Main process exited|Failed' | head -6; \
                   echo; systemd-analyze blame --no-pager | head -8; echo; systemctl list-timers --no-pager | head -14" > "$out/boot.txt" 2>&1 || true
          cat "$out/boot.txt"

      - name: Summary
        if: always()
        run: |
          out="$RUNNER_TEMP/out"
          python3 - "$out" <<'PY' > "$out/summary.md"
          import os, sys
          d = sys.argv[1]
          def kv(n):
              r = {}
              try:
                  for l in open(os.path.join(d, n), encoding="utf-8"):
                      if "=" in l:
                          k, v = l.rstrip("\n").split("=", 1); r[k] = v
              except OSError:
                  pass
              return r
          b, a, t = kv("before.txt"), kv("after.txt"), kv("drill.txt")
          units = ["lifolo_api", "nginx", "postgresql", "postgresql_16_main", "redis_server", "ssh", "fail2ban", "ufw",
                   "unattended_upgrades", "cron", "lifolo_backup_timer", "certbot_timer", "logrotate_timer"]
          ok_all = True
          rows = []
          for u in units:
              v = a.get("unit_" + u, "?")
              good = v.startswith("active/") and ("enabled" in v or "static" in v or "generated" in v or "alias" in v)
              if u == "ssh" and a: good = True  # Ubuntu 24.04: ssh.socket চালু করে; আমরা ঢুকতে পেরেছি মানেই চলে
              if not good: ok_all = False
              rows.append(f"| {u.replace('_', '-')} | {b.get('unit_' + u, '?')} | {v} | {'✅' if good else '❌'} |")
          new_boot = b.get("boot_id") and a.get("boot_id") and b["boot_id"] != a["boot_id"]
          green = t.get("health_green_s", "timeout")
          print("## ⚠️ VPS রিবুট মহড়া — সার্ভার রিবুট করা হয়েছিল")
          print()
          print(f"**রিবুট:** {t.get('rebooted_at', '?')} · নতুন boot: {'হ্যাঁ' if new_boot else 'না ⚠️'} (আগে চালু ছিল {b.get('booted_at', '?')} থেকে)")
          print()
          print("| মাপ | সময় (রিবুট কমান্ড থেকে) |")
          print("|---|---|")
          print(f"| সাইট বন্ধ হলো | {t.get('down_after_s', '?')} s |")
          print(f"| SSH (পোর্ট 22) ফিরল | {t.get('ssh_up_s', '?')} s |")
          print(f"| **https /api/health সবুজ (সরাসরি VPS)** | **{green} s** |")
          print(f"| Cloudflare দিয়ে (lifolo.com/api/health) | {t.get('public_via_cloudflare', '?')} |")
          print(f"| Spring চালুর আগে nginx-এর উত্তর | {t.get('down_body', '?')} |")
          print()
          print(f"বুট: {a.get('boot_time', '?')} · অ্যাপ: {a.get('api_spring_started', '?')} · health (ভেতর থেকে): {a.get('api_health_local', '?')}, "
                f"PostgreSQL: {a.get('pg_ready', '?')}, Redis: {a.get('redis_ping', '?')}, swap: {a.get('swap_on', '?') or 'নেই'}, ফায়ারওয়াল: {a.get('ufw', '?')}")
          print()
          print("| সার্ভিস | আগে (active/enabled) | রিবুটের পরে | নিজে চালু? |")
          print("|---|---|---|---|")
          print("\n".join(rows))
          print()
          fu = a.get("failed_units", "").strip()
          fb = set(b.get("failed_units", "").split())
          new_fail = [u for u in fu.split() if u not in fb]
          print(f"ব্যর্থ unit (রিবুটের পরে): {fu or 'নেই'}" + (f" — নতুন: {' '.join(new_fail)} ⚠️" if new_fail else (" (আগেও ব্যর্থ ছিল, Lifolo-র অংশ নয়)" if fu else "")))
          if a.get("cloud_init"):
              print(f"cloud-init: `{a['cloud_init']}`")
          print(f"রিবুট দরকার (আপডেটের পর): {a.get('reboot_required', '?')} · unattended-upgrades নিজে রিবুট করে: {a.get('auto_reboot', '') or 'না (ডিফল্ট false)'}")
          print()
          tb, ta = kv("tune-before.txt"), kv("tune-after.txt")
          if ta:
              print("| সেটিং | রিবুটের আগে | পরে |")
              print("|---|---|---|")
              for k in ["api_cmdline", "pg", "redis", "nginx_worker_connections", "nginx_nofile", "ufw", "ufw_cloudflare_rules", "ufw_open_80_443"]:
                  print(f"| {k} | {tb.get(k, '?')} | {ta.get(k, '?')} |")
              print()
          print(f"**ফল:** {'✅ সব সার্ভিস নিজে নিজে ফিরেছে' if ok_all and green != 'timeout' and not new_fail else '❌ কিছু ফেরেনি — ওপরের সারণি দেখুন'}")
          PY
          {
            echo
            echo "<details><summary>বুটের বিস্তারিত</summary>"
            echo
            echo '```'
            cat "$out/boot.txt" 2>/dev/null
            echo '```'
            echo "</details>"
            echo
            echo "_run ${{ github.run_id }} · গাইড: deploy/OPS-DRILLS.md_"
          } >> "$out/summary.md"
          ip_re="${ORIGIN_IP//./\\.}"; dash_re="${ORIGIN_IP//./-}"
          for f in "$out"/*; do [ -f "$f" ] && sed -i -e "s/$ip_re/<vps-ip>/g" -e "s/$dash_re/<vps-ip>/g" "$f"; done
          cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Close the temporary hole
        if: always()
        run: bash deploy/ci/origin-access.sh close || true

      - name: Publish to the log branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          LOG_BRANCH: ${{ inputs.log_branch || 'ci-log-ops-drills' }}
          LOG_MESSAGE: ops restart drill ${{ github.run_id }} ${{ job.status }}
        run: |
          src="$RUNNER_TEMP/log"; rm -rf "$src"; mkdir -p "$src/restart"
          out="$RUNNER_TEMP/out"
          cp "$out/summary.md" "$src/restart/summary.md" 2>/dev/null || true
          cat "$out/drill.txt" "$out/after.txt" > "$src/restart/status.txt" 2>/dev/null || true
          cp "$out/before.txt" "$src/restart/before.txt" 2>/dev/null || true
          { echo "run=${GITHUB_RUN_ID}"; echo "job=${{ job.status }}"; } >> "$src/restart/status.txt"
          cp "$out/tune-after.txt" "$src/restart/tune-after.txt" 2>/dev/null || true
          [[ "$LOG_BRANCH" =~ ^ci-log-[a-z0-9-]+$ ]] || LOG_BRANCH=ci-log-ops-drills
          bash .github/scripts/publish-log.sh "$LOG_BRANCH" "$src" restart

      - name: Clean up
        if: always()
        run: |
          ssh -O exit vps 2>/dev/null || true
          rm -rf ~/.ssh/lifolo ~/.ssh/config
