name: Deploy server (VPS)

# Contabo VPS-এ সার্ভার ডেপ্লয়: আগে সার্ভারের টেস্ট, তারপর SSH করে git pull → npm ci → restart → health।
# সংযোগ Setup VPS-এর মতোই (deploy/ci/vps-connect.sh): VPS_HOST + VPS_ROOT_PASSWORD —
# তা থেকে বানানো চাবি আর পিন করা host key। সিক্রেট না থাকলে ডেপ্লয় ধাপ নিজে থেকেই বাদ পড়ে (টেস্ট তবু চলে)।
# VPS-এ /usr/local/sbin/lifolo-deploy (deploy/lifolo-deploy.sh) lifolo ব্যবহারকারী হিসেবে চলে:
# git pull → npm ci --omit=dev (lock বদলালে) → systemctl restart lifolo → /healthz।
# deploy/ (nginx, systemd, এই স্ক্রিপ্টগুলো) বদলালে Setup VPS আবার চালাতে হয়; এই workflow সেগুলো বসায় না।
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-vps.yml"
  workflow_dispatch:

permissions:
  contents: read

# একসাথে দুটো ডেপ্লয় নয়; চলতি ডেপ্লয় মাঝপথে বাতিল নয় (npm ci-র মাঝে থামলে node_modules ভাঙা থাকত)
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        working-directory: server
        run: npm ci --no-audit --no-fund
      - name: Server tests
        working-directory: server
        run: npm test
      - name: Deploy helper tests (deploy/ci)
        run: node --test deploy/ci/test/*.test.js
      - name: Are VPS secrets set?
        id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_ROOT_PASSWORD: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_ROOT_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS_HOST আর VPS_ROOT_PASSWORD সেট করা নেই — ডেপ্লয় বাদ"
          fi

  deploy:
    needs: test
    # শুধু main থেকে (হাতে চালালেও অন্য শাখা থেকে নয়)
    if: needs.test.outputs.enabled == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Connect to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_ROOT_PASSWORD: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: bash deploy/ci/vps-connect.sh

      - name: Pull, install, restart, health check
        run: ssh vps 'sudo -u lifolo -H /usr/local/sbin/lifolo-deploy'

      - name: Clean up key
        if: always()
        run: ssh -O exit vps 2>/dev/null || true; rm -rf ~/.ssh/lifolo ~/.ssh/config
