name: Deploy server (VPS)

# Contabo VPS-এ সার্ভার ডেপ্লয়: আগে সার্ভারের টেস্ট, তারপর SSH করে git pull → npm ci → restart → health দেখা।
# GitHub-এ VPS_HOST, VPS_USER, VPS_SSH_KEY সিক্রেট না থাকলে ডেপ্লয় ধাপ নিজে থেকেই বাদ পড়ে (টেস্ট তবু চলে)।
# VPS_KNOWN_HOSTS-ও লাগে (setup-vps.sh শেষে যে লাইন দেখায়) — VPS-এর পরিচয় যাচাই, নইলে মাঝপথে কেউ নকল সার্ভার সাজাতে পারে।
# VPS-এ চাবিটা command= দিয়ে বাঁধা: SSH করলেই /usr/local/sbin/lifolo-deploy (deploy/lifolo-deploy.sh) চলে —
# git pull → npm ci --omit=dev (lock বদলালে) → systemctl restart lifolo → /healthz।
# deploy/ (nginx, systemd, এই স্ক্রিপ্টগুলো) বদলালে VPS-এ setup-vps.sh আবার চালাতে হয়; এই workflow সেগুলো বসায় না।
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-vps.yml"
  workflow_dispatch:

permissions:
  contents: read

# একসাথে দুটো ডেপ্লয় নয়; চলতি ডেপ্লয় মাঝপথে বাতিল নয় (npm ci-র মাঝে থামলে node_modules ভাঙা থাকত)
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        working-directory: server
        run: npm ci --no-audit --no-fund
      - name: Server tests
        working-directory: server
        run: npm test
      - name: Are VPS secrets set?
        id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS_HOST / VPS_USER / VPS_SSH_KEY সেট করা নেই — ডেপ্লয় বাদ"
          fi

  deploy:
    needs: test
    # শুধু main থেকে (হাতে চালালেও অন্য শাখা থেকে নয়)
    if: needs.test.outputs.enabled == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: SSH key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::error::VPS_KNOWN_HOSTS secret নেই — setup-vps.sh-এর শেষে দেখানো লাইনটা যোগ করুন"
            exit 1
          fi
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull, install, restart, health check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        # চাবির command= নিজেই lifolo-deploy চালায় (এখানে কমান্ড পাঠানো লাগে না, পাঠালেও উপেক্ষা হয়)
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$VPS_USER@$VPS_HOST" deploy

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/id_deploy
