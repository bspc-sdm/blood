name: Uptime check

# প্রতি ১০ মিনিটে https://lifolo.com/api/health দেখা (অ্যাপ, ওয়েব আর /api — সবাই এখানে, ২.৩৪.০ থেকে)।
# বন্ধ থাকলে workflow ব্যর্থ হয় → GitHub রিপোর মালিককে ইমেইল পাঠায়।
# একই বিভ্রাটে বারবার ইমেইল নয়: প্রথমবার, তারপর বন্ধ থাকলে প্রতি ৩ ঘণ্টায় একবার।
# ঠিকানা: HEALTH_URL (Settings → Secrets and variables → Actions → Variables) দিলে সেটা, না দিলে
# https://lifolo.com/api/health (Spring অ্যাপের {"ok":true,...} — nginx আর অ্যাপ দুটোই দেখা হয়)।
# উত্তরে "ok":true থাকতে হবে।
# GitHub শুধু main শাখার schedule চালায়; ৬০ দিন রিপোতে কোনো কাজ না হলে schedule নিজে বন্ধ করে (তখন Actions-এ Enable চাপুন)।
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Health URL
        id: url
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          url="$(printf '%s' "$HEALTH_URL" | tr -d '[:space:]')"
          url="${url:-https://lifolo.com/api/health}"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Previous state
        if: steps.url.outputs.url != ''
        uses: actions/cache/restore@v4
        with:
          path: uptime-state
          key: uptime-state-${{ github.run_id }}
          restore-keys: uptime-state-

      - name: Check
        id: check
        if: steps.url.outputs.url != ''
        env:
          URL: ${{ steps.url.outputs.url }}
        run: |
          mkdir -p uptime-state
          ok=no
          # একবার না পেলেই নয় — ১ মিনিটে ৩ বার চেষ্টা
          for i in 1 2 3; do
            if body="$(curl -fsS -m 20 "$URL" 2>&1)" && [[ "$body" == *'"ok":true'* ]]; then ok=yes; break; fi
            echo "attempt $i: $body"
            [ "$i" = 3 ] || sleep 25
          done
          now=$(date +%s)
          last_alert=$(cat uptime-state/last_alert 2>/dev/null || echo 0)
          if [ "$ok" = yes ]; then
            echo "up: $URL"
            rm -f uptime-state/last_alert
            echo "alert=no" >> "$GITHUB_OUTPUT"
          elif [ $((now - last_alert)) -ge 10800 ]; then
            echo "$now" > uptime-state/last_alert
            echo "alert=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::সার্ভার এখনো বন্ধ (ইমেইল আগেই গেছে; ৩ ঘণ্টা পর আবার)"
            echo "alert=no" >> "$GITHUB_OUTPUT"
          fi
          touch uptime-state/checked

      - name: Save state
        if: steps.url.outputs.url != ''
        uses: actions/cache/save@v4
        with:
          path: uptime-state
          key: uptime-state-${{ github.run_id }}

      - name: Alert
        if: steps.check.outputs.alert == 'yes'
        env:
          URL: ${{ steps.url.outputs.url }}
        run: |
          echo "## ❌ Lifolo (VPS) সাড়া দিচ্ছে না" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL — VPS চালু আছে কি না (Contabo প্যানেল) দেখুন, এই পাতার স্ক্রিনশট Claude-কে পাঠান।" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::সার্ভার বন্ধ: $URL"
          exit 1
