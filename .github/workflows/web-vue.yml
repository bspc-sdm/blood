name: Web (Vue) check

# Vue ওয়েব আর অ্যাডমিন (web-vue/) বদলালে: টাইপ চেক, লিন্ট, বাংলা লেখা হুবহু কি না, ছোট পরীক্ষা, বিল্ড,
# তারপর Playwright — বানানো পাতা নকল API-র সাথে (test/serve.mjs + test/fixtures), অ্যাডমিন কড়া CSP সহ।
# আসল সার্ভারের পুরো যাত্রা (e2e/web/journeys, Auth emulator) — শুধু হাতে চালালে (workflow_dispatch, journeys: true)।
on:
  push:
    branches: [main, vue-web, cutover, spring]
    paths:
      - "web-vue/**"
      - ".github/workflows/web-vue.yml"
  pull_request:
    paths:
      - "web-vue/**"
      - ".github/workflows/web-vue.yml"
  workflow_dispatch:
    inputs:
      journeys:
        description: "আসল সার্ভারের পুরো যাত্রাও (e2e/web/journeys) চালানো"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web-vue
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-vue/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Bangla text byte-for-byte (against web/src and server/public/admin)
        run: npm run check:bangla
      - name: Unit tests
        run: npm run test:unit
      - name: Build (web + admin)
        run: npm run build
      - name: Test build (mocked API)
        run: npm run build:test
      - name: Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright (mocked API)
        run: npx playwright test
      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web-vue/playwright-report
            web-vue/test-results
          retention-days: 7

  journeys:
    if: github.event_name == 'workflow_dispatch' && inputs.journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install (server, e2e, web-vue)
        run: |
          (cd server && npm ci)
          (cd e2e && npm ci)
          (cd web-vue && npm ci)
      - name: Playwright browser
        working-directory: web-vue
        run: npx playwright install --with-deps chromium
      - name: Journeys on the Vue web + Vue admin (local server, Auth emulator)
        working-directory: web-vue
        run: CHROME="$(node -e "console.log(require('playwright-core').chromium.executablePath())")" node e2e/journeys.mjs
      - name: Shots and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journeys
          path: e2e/web/shots
          retention-days: 7
