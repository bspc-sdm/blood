name: Web (Vue) check

# Vue ওয়েব আর অ্যাডমিন (web-vue/) বদলালে: টাইপ চেক, লিন্ট, বাংলা লেখা হুবহু কি না, ছোট পরীক্ষা, বিল্ড,
# তারপর Playwright — বানানো পাতা নকল API-র সাথে (test/serve.mjs + test/fixtures), অ্যাডমিন কড়া CSP সহ।
# আসল সার্ভারের (Spring) সাথে পুরো যাত্রা (e2e/web/journeys) এখন "Web e2e (Vue web + Spring)" — backend-e2e.yml।
on:
  push:
    branches: [main, vue-web, cutover, spring]
    paths:
      - "web-vue/**"
      - ".github/workflows/web-vue.yml"
  pull_request:
    paths:
      - "web-vue/**"
      - ".github/workflows/web-vue.yml"
  workflow_dispatch:

# একই শাখায় নতুন push এলে আগেরটা বাতিল (হাতে চালানো journeys আলাদা দলে, বাতিল হয় না)
concurrency:
  group: web-vue-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web-vue
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-vue/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Bangla text byte-for-byte (against web/src and server/public/admin)
        run: npm run check:bangla
      - name: Unit tests
        run: npm run test:unit
      - name: Build (web + admin)
        run: npm run build
      - name: Test build (mocked API)
        run: npm run build:test
      - name: Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright (mocked API)
        run: npx playwright test
      # আসল LiveKit-এর সাথে দুই ট্যাবের কল (অ্যাপয়েন্টমেন্টের ভিডিও, রক্তের অডিও কল) — লোকাল livekit-server --dev
      - name: LiveKit server (1.13.10, checksum)
        run: |
          mkdir -p "$RUNNER_TEMP/lk" && cd "$RUNNER_TEMP/lk"
          curl -fsSL -o lk.tgz https://github.com/livekit/livekit/releases/download/v1.13.10/livekit_1.13.10_linux_amd64.tar.gz
          echo "c25a3e45fb922e9a93c6443d10c0ed041ba64342097e38632331736630283165  lk.tgz" | sha256sum -c -
          tar xzf lk.tgz livekit-server
          echo "LIVEKIT_BIN=$RUNNER_TEMP/lk/livekit-server" >> "$GITHUB_ENV"
      - name: Playwright (real LiveKit, two tabs)
        run: npx playwright test -c playwright.livekit.config.ts
      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web-vue/playwright-report
            web-vue/playwright-report-livekit
            web-vue/test-results
          retention-days: 7
