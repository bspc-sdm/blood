name: Web build check

# ওয়েবের কোড (web/) বদলালে: টাইপ চেক, বিল্ড, আর server/public/w-তে রাখা বিল্ড যে নতুন কোডের সাথে মেলে তা যাচাই
# (Vercel ওই ফোল্ডারটাই দেয় — বিল্ড করতে ভুলে গেলে এখানে ধরা পড়ে)
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "server/public/w/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "server/public/w/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Typecheck and build
        working-directory: web
        run: npm run build
      - name: Committed build is up to date
        run: |
          if [ -n "$(git status --porcelain server/public/w)" ]; then
            git status --porcelain server/public/w | head -20
            echo "::error::server/public/w পুরোনো — web/-এ npm run build চালিয়ে বিল্ডসহ কমিট করুন"
            exit 1
          fi
