name: "Ops: timers and jobs check"

# নির্ধারিত কাজগুলো গত ২৪ ঘণ্টায় চলেছে কি না — শুধু দেখা: systemd timer (lifolo-backup, certbot, logrotate, apt …),
# দৈনিক ব্যাকআপের ফাইল, cron, আর অ্যাপের ভেতরের JobRunr কাজ (daily-maintenance রোজ 03:00 UTC, storage-trash আর
# ambulance-timers প্রতি মিনিটে)। বাংলা গাইড: deploy/OPS-DRILLS.md। ফল log branch `ci-log-ops-drills`-এ: timers/summary.md।
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ops-timers
  cancel-in-progress: false

jobs:
  timers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ip="$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')"
          [[ "$ip" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]] || { echo "::error::VPS_HOST-এ IP নেই"; exit 1; }
          echo "::add-mask::$ip"; echo "::add-mask::${ip//./-}"
          echo "ORIGIN_IP=$ip" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/out"

      - name: Connect to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_ROOT_PASSWORD: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: bash deploy/ci/vps-connect.sh

      - name: Timers, backups, JobRunr
        run: |
          ssh vps "install -d -m 0700 /root/lifolo-ops && cat > /root/lifolo-ops/.vps-ops.sh.\$\$ && mv /root/lifolo-ops/.vps-ops.sh.\$\$ /root/lifolo-ops/vps-ops.sh" < deploy/ops/vps-ops.sh
          ssh vps "bash /root/lifolo-ops/vps-ops.sh timers" | tee "$RUNNER_TEMP/out/timers.md"

      - name: GitHub schedules (uptime, weekly backup check)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### GitHub-এর নির্ধারিত workflow (শেষ চলা)"
            echo "| workflow | শেষ চলা (UTC) | ফল |"
            echo "|---|---|---|"
            for wf in uptime.yml backup-check.yml; do
              r="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/$wf/runs?per_page=1&event=schedule" --jq '.workflow_runs[0] | "\(.created_at) | \(.conclusion // .status)"' 2>/dev/null || true)"
              echo "| $wf | ${r:-কখনো schedule-এ চলেনি | —} |"
            done
          } | tee "$RUNNER_TEMP/out/gh.md"

      - name: Summary
        if: always()
        run: |
          out="$RUNNER_TEMP/out"
          {
            echo "## নির্ধারিত কাজ (timer, cron, JobRunr) — গত ২৪ ঘণ্টা"
            echo
            cat "$out/timers.md" 2>/dev/null
            echo
            cat "$out/gh.md" 2>/dev/null
            echo
            echo "_run ${{ github.run_id }} · গাইড: deploy/OPS-DRILLS.md_"
          } > "$out/summary.md"
          ip_re="${ORIGIN_IP//./\\.}"; dash_re="${ORIGIN_IP//./-}"
          for f in "$out"/*; do [ -f "$f" ] && sed -i -e "s/$ip_re/<vps-ip>/g" -e "s/$dash_re/<vps-ip>/g" "$f"; done
          cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to the log branch (ci-log-ops-drills)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          LOG_MESSAGE: ops timers check ${{ github.run_id }} ${{ job.status }}
        run: |
          src="$RUNNER_TEMP/log"; rm -rf "$src"; mkdir -p "$src/timers"
          cp "$RUNNER_TEMP/out/summary.md" "$src/timers/summary.md" 2>/dev/null || true
          { echo "run=${GITHUB_RUN_ID}"; echo "job=${{ job.status }}"; } > "$src/timers/status.txt"
          bash .github/scripts/publish-log.sh ci-log-ops-drills "$src" timers

      - name: Clean up
        if: always()
        run: |
          ssh -O exit vps 2>/dev/null || true
          rm -rf ~/.ssh/lifolo ~/.ssh/config
