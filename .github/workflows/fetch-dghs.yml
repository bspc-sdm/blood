name: Fetch DGHS facility list

# হাতে চালানো হয়; ফল "data-dghs" শাখায় dghs-raw.json হিসেবে রাখা হয়
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node scripts/fetch-dghs.mjs
      - name: Save to data-dghs branch
        run: |
          mkdir -p /tmp/out && mv dghs-raw.json /tmp/out/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan data-dghs
          git rm -rf --quiet .
          cp /tmp/out/dghs-raw.json .
          git add dghs-raw.json
          git commit -m "DGHS facility registry snapshot"
          git push -f origin data-dghs
