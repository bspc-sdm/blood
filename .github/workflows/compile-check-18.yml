name: Compile check (temp)
on:
  push:
    branches: [compile-check-18]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
      - if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r line; do echo "::error::${line//$'\r'/}"; done
