name: Temp check (work-tab)

on:
  push:
    branches: [work-tab]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compile
        run: |
          set -o pipefail
          gradle compileDebugUnitTestKotlin 2>&1 | tee compile.log | tail -5
          if grep -qE "^e: " compile.log; then
            grep -E "^e: " compile.log | head -40 | while IFS= read -r line; do echo "::error::${line//$'\r'/}"; done
            exit 1
          fi
      - name: Tests
        run: |
          for t in doctorListFilterBarBangla; do
            echo "=== $t" | tee -a test.log
            gradle testDebugUnitTest --tests "com.bspc.blood.ScreensTest.$t" 2>&1 | grep -E "ScreensTest|Exception|Error|Caused by|at com|at androidx|FAILED|কেটে|What went wrong" | head -80 | tee -a test.log || true
          done
      - name: Save
        if: always()
        run: |
          mkdir -p /tmp/out
          cp app/build/screens/*.png /tmp/out/ 2>/dev/null || true
          cp test.log /tmp/out/ 2>/dev/null || true
          cp compile.log /tmp/out/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan screens-work
          git rm -rf --quiet .
          git clean -fdxq
          cp /tmp/out/* .
          mkdir -p server && echo '{"git":{"deploymentEnabled":false}}' > server/vercel.json
          git add -A
          git commit -m "check ${{ github.sha }}" || true
          git push -f origin screens-work
