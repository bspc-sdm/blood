name: Web probe (temp)
on:
  push:
    branches: [web-probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          B=https://blood-server-ashy.vercel.app
          sleep 60
          for i in $(seq 1 45); do
            d=$(curl -s -m 20 -I $B/admin/app.js | grep -i '^age:' | tr -dc 0-9)
            curl -s -m 20 $B/api/health | grep -q . && [ -n "$d" ] && [ "$d" -lt 600 ] && exit 0
            sleep 20
          done; exit 0
