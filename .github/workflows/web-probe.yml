name: Web probe (temp)
on:
  push:
    branches: [web-probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          B=https://blood-server-ashy.vercel.app
          R=$(curl -s -m 20 -X POST -H 'Content-Type: application/json' -d '{"demoRoles":true}' $B/api/auth/verify-code)
          echo "$R"
          echo "$R" | grep -q '"active":false'
