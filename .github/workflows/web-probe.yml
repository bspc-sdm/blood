name: Web probe (temp)
on:
  push:
    branches: [web-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe live
        run: |
          mkdir -p /tmp/out && cd /tmp/out
          B=https://blood-server-ashy.vercel.app
          for i in $(seq 1 40); do
            if curl -s -m 20 $B/ | grep -q '/w/assets/'; then echo "live after $i tries" > live.txt; break; fi
            sleep 20
          done
          for p in / /services/pharmacy /request/abc /work /w/manifest.webmanifest /w/data/geo.json /admin /doctor /r/doesnotexist /api/health /favicon.ico /.well-known/assetlinks.json; do
            echo "== $p" >> paths.txt
            curl -s -m 20 -o body.tmp -D hdr.tmp -w "%{http_code} %{content_type}\n" "$B$p" >> paths.txt
            grep -iE "^(content-security-policy|cache-control|x-frame-options):" hdr.tmp | cut -c1-160 >> paths.txt
            head -c 200 body.tmp | tr '\n' ' ' >> paths.txt; echo >> paths.txt
          done
          JS=$(curl -s $B/ | grep -oE '/w/assets/index-[^"]+\.js' | head -1); echo "main js: $JS" >> paths.txt
          curl -s -o /dev/null -D - "$B$JS" | grep -iE "^(HTTP|cache-control|content-type)" >> paths.txt
          curl -sS -m 30 -H 'content-type: application/json' -d '{"action":"catalog_get"}' $B/api/community | head -c 120 >> paths.txt
      - name: Save
        if: always()
        run: |
          cd /tmp/out
          git init -q . && git checkout -q -b web-probe-out
          mkdir -p server && echo '{"git":{"deploymentEnabled":false}}' > server/vercel.json
          git -c user.name=ci -c user.email=ci@x add -A && git -c user.name=ci -c user.email=ci@x commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" web-probe-out
