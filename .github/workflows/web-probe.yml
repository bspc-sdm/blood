name: Web probe (temp)
on:
  push:
    branches: [web-probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for new build live
        run: |
          for i in $(seq 1 45); do
            if curl -s -m 20 https://blood-server-ashy.vercel.app/ | grep -q '/w/assets/index-Clb3b_Z0.js'; then echo "LIVE after $i"; exit 0; fi
            sleep 20
          done
          echo "not live"; exit 1
