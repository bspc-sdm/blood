name: Check app name domains

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node scripts/check-names.mjs
      - name: Save to names branch
        run: |
          mkdir -p /tmp/out && mv names.txt /tmp/out/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan names
          git rm -rf --quiet .
          git clean -fdxq
          cp /tmp/out/names.txt .
          mkdir -p server && echo '{"git":{"deploymentEnabled":false}}' > server/vercel.json
          git add -A
          git commit -m "Name availability"
          git push -f origin names
