name: Fetch DGDA drug list

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node scripts/fetch-drugs.mjs 2>&1 | tee fetch.log
      - name: Save to data-drugs branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp drugs-raw.json fetch.log /tmp/out/ 2>/dev/null || cp fetch.log /tmp/out/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan data-drugs
          git rm -rf --quiet .
          git clean -fdxq
          cp /tmp/out/* .
          mkdir -p server && echo '{"git":{"deploymentEnabled":false}}' > server/vercel.json
          git add -A
          git commit -m "DGDA drug list snapshot"
          git push -f origin data-drugs
