name: Probe drug registry API

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/probe.sh > probe.txt 2>&1 || true
      - name: Save
        run: |
          mkdir -p /tmp/out && mv probe.txt /tmp/out/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan probe
          git rm -rf --quiet .
          git clean -fdxq
          cp /tmp/out/probe.txt .
          mkdir -p server && echo '{"git":{"deploymentEnabled":false}}' > server/vercel.json
          git add -A
          git commit -m "Probe"
          git push -f origin probe
