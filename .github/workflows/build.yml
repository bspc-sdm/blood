name: Build APK

on:
  push:
    branches: [main]
    # শুধু অ্যাপের কোড বদলালে নতুন APK (সার্ভার বা লেখা বদলালে রিলিজে হাত দেওয়া হয় না)
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build.yml"
  workflow_dispatch:

# "latest" রিলিজে APK রাখার জন্য লেখার অনুমতি
permissions:
  contents: write

# একসাথে দুটো বিল্ড যেন একই রিলিজ নিয়ে টানাটানি না করে
concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
      # বিল্ড ব্যর্থ হলে কম্পাইলের ভুলগুলো annotation হিসেবে দেখানো (API দিয়ে পড়া যায়)
      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line//$'\r'/}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: blood-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # সরাসরি ডাউনলোডের স্থায়ী লিংক (zip ছাড়া):
      # https://github.com/bspc-sdm/blood/releases/download/latest/roktodan.apk
      # রিলিজ আর মোছা হয় না (মোছা আর নতুন বানানোর মাঝে লিংক ৪০৪ দিত)। ক্রম:
      # ১) ভার্সনের নামে নতুন APK, ২) পুরোনো অ্যাপের জন্য roktodan.apk, ৩) সবশেষে version.json —
      # তাই অ্যাপ নতুন ভার্সনের খবর পায় APK তৈরি থাকার পরেই।
      - name: Publish APK to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          VAPK="dorkar-${NAME}-${CODE}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$VAPK"
          cp app/build/outputs/apk/debug/app-debug.apk roktodan.apk
          URL="https://github.com/${{ github.repository }}/releases/download/latest/$VAPK"
          echo "{\"versionCode\": $CODE, \"versionName\": \"$NAME\", \"url\": \"$URL\"}" > version.json
          cat version.json
          NOTES="স্বয়ংক্রিয়ভাবে তৈরি টেস্ট APK (commit ${{ github.sha }}). ফোনে সরাসরি ডাউনলোড করে ইনস্টল করুন।"
          if gh release view latest > /dev/null 2>&1; then
            gh release upload latest "$VAPK" --clobber
            gh release upload latest roktodan.apk --clobber
            gh release upload latest version.json --clobber
            git tag -f latest "${{ github.sha }}"
            git push -f origin refs/tags/latest
            gh release edit latest --notes "$NOTES"
            # ভার্সনের নামের APK শেষ ৩টা রাখা
            gh release view latest --json assets --jq '.assets[].name' | grep -E '^(lifolo|dorkar)-.*\.apk$' | sort -V | head -n -3 | while read -r old; do
              gh release delete-asset latest "$old" --yes
            done
          else
            gh release create latest "$VAPK" roktodan.apk version.json \
              --target "${{ github.sha }}" \
              --prerelease \
              --title "সর্বশেষ টেস্ট ভার্সন" \
              --notes "$NOTES"
          fi
