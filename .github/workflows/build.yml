name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# "latest" রিলিজে APK রাখার জন্য লেখার অনুমতি
permissions:
  contents: write

# একসাথে দুটো বিল্ড যেন একই রিলিজ নিয়ে টানাটানি না করে
concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: blood-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # সরাসরি ডাউনলোডের স্থায়ী লিংক (zip ছাড়া):
      # https://github.com/bspc-sdm/blood/releases/download/latest/roktodan.apk
      - name: Publish APK to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk roktodan.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest roktodan.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "সর্বশেষ টেস্ট ভার্সন" \
            --notes "স্বয়ংক্রিয়ভাবে তৈরি টেস্ট APK (commit ${{ github.sha }}). ফোনে সরাসরি ডাউনলোড করে ইনস্টল করুন।"
