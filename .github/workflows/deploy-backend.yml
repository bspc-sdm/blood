name: Deploy backend

# Kotlin/Spring API + ওয়েবসাইট (Vue) → VPS। ২.৩৪.০ থেকে main-এ push হলে নিজেই চলে (backend/, web-vue/, deploy/ বা এই
# ফাইল বদলালে — ডেমো keep, lifolo.com, api.lifolo.com); হাতে: Actions → "Deploy backend" → Run workflow → branch main।
# বাংলা গাইড: deploy/BASE-SETUP.md, বদলের দিনের ধাপ: deploy/CUTOVER.md
# আগে একবার "Setup VPS (base)" সফল হতে হবে (একই SSH পদ্ধতি: VPS_HOST + VPS_ROOT_PASSWORD থেকে বানানো চাবি)।
#
# ধাপ: jar বানানো → VPS-এ পাঠানো → deploy/tune-vps.sh (JVM/PostgreSQL/Redis/nginx-এর সেটিং, origin শুধু Cloudflare-এর
# জন্য — ufw) → deploy/deploy-backend.sh (app.env, systemd restart → Flyway, nginx-এ /api /r /rx
# /shop /.well-known, ভেতর থেকে পরীক্ষা, ডেমো) → web-vue বিল্ড → deploy/deploy-web.sh (lifolo.com: /w/ /admin/ আর
# Vercel-এর বাকি পথ, www → lifolo.com, সার্টিফিকেট শুধু DNS এলে) → বাইরে থেকে পরীক্ষা (api.lifolo.com দিয়ে ডেমো লগইন
# আর কয়েকটা পড়া) → বাংলা সারাংশ।
# ফলাফল (গোপন কিছু ছাড়া) log branch `ci-log-deploy`-এও: deploy-status.txt, summary.md।
#
# সিক্রেট (Settings → Secrets and variables → Actions):
#   VPS_HOST, VPS_ROOT_PASSWORD   — আবশ্যক (Setup VPS-এর একই দুটো)
#   FIREBASE_SERVICE_ACCOUNT      — Firebase service account JSON (বা base64)। না থাকলে অ্যাপ চলে কিন্তু লগইন/পুশ বন্ধ
#   ADMIN_EMAILS                  — ঐচ্ছিক (খালি = ekapkbd@gmail.com)
#   SES_REGION, SES_ACCESS_KEY_ID, SES_SECRET_ACCESS_KEY, SES_FROM — ঐচ্ছিক; না থাকলে লগইন-কোডের ইমেইল যায় না
#   R2_ACCOUNT_ID (বা R2_ENDPOINT), R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET — ঐচ্ছিক
#   SENTRY_DSN, SMS_URL_TEMPLATE, PUBLIC_BASE_URL — ঐচ্ছিক
# push-এ আগে "check" (shellcheck + চাবির টেস্ট); main-এ push হলে check পাস করার পর deploy-ও। অন্য শাখার push-এ শুধু check।
on:
  workflow_dispatch:
    inputs:
      demo:
        description: "ডেমো (গাজীপুর): keep = না থাকলে বানিয়ে রাখা · smoke = বানিয়ে আবার মোছা · off = হাত নয়"
        type: choice
        options: [keep, smoke, "off"]
        required: false
        default: keep
      web_domain:
        description: "ওয়েবসাইটের নাম (www.<নাম> → <নাম>); DNS এই VPS-এ গেলে তবেই সার্টিফিকেট; খালি = ওয়েব বসানো হয় না"
        type: string
        required: false
        default: "lifolo.com"
      web_cert:
        description: "ওয়েবসাইটের সার্টিফিকেট চাওয়া (না থাকলে); বন্ধ = শুধু ফাইল আর DNS-এর খবর"
        type: boolean
        required: false
        default: true
      api_domain:
        description: "আলাদা নাম (DNS-এ এই VPS-এ গেলে তবেই সার্টিফিকেট); খালি = শুধু sslip.io"
        type: string
        required: false
        default: "api.lifolo.com"
  push:
    branches: [main, spring, "spring-p*", cutover]
    paths:
      - "backend/**"
      - "web-vue/**"
      - "deploy/**"
      - "PRIVACY.md"
      - "TERMS.md"
      - ".github/workflows/deploy-backend.yml"

permissions:
  contents: write

concurrency:
  group: vps-admin
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Shell scripts
        run: |
          rc=0
          for f in deploy/setup-base.sh deploy/deploy-backend.sh deploy/deploy-web.sh deploy/tune-vps.sh deploy/ops/vps-ops.sh deploy/ci/vps-connect.sh deploy/ci/origin-access.sh deploy/ci/publish-download.sh; do bash -n "$f" || rc=1; done
          shellcheck --version | sed -n 2p
          # findings as annotations (readable without the log download)
          shellcheck -S warning -f gcc deploy/setup-base.sh deploy/deploy-backend.sh deploy/deploy-web.sh deploy/tune-vps.sh deploy/ops/vps-ops.sh deploy/ci/vps-connect.sh deploy/ci/origin-access.sh deploy/ci/publish-download.sh > "$RUNNER_TEMP/sc.txt" || rc=1
          sed -E 's/^([^:]+):([0-9]+):([0-9]+): (.*)$/::error file=\1,line=\2::\4/' "$RUNNER_TEMP/sc.txt"
          exit "$rc"
      - name: Key derivation test
        run: node --test deploy/ci/test/derive-keys.test.js

  deploy:
    needs: check
    # হাতে চালালে check বাদ (skipped); main-এ push হলে check পাস করলে তবেই
    if: >-
      always() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check.result == 'success')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # push-এ inputs খালি — তখন হাতে চালানোর ডিফল্টগুলোই (ডেমো keep, lifolo.com, সার্টিফিকেট চাওয়া, api.lifolo.com)
    env:
      IN_DEMO: ${{ github.event_name == 'push' && 'keep' || inputs.demo }}
      IN_WEB_DOMAIN: ${{ github.event_name == 'push' && 'lifolo.com' || inputs.web_domain }}
      IN_WEB_CERT: ${{ github.event_name == 'push' || inputs.web_cert }}
      IN_API_DOMAIN: ${{ github.event_name == 'push' && 'api.lifolo.com' || inputs.api_domain }}
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        id: host
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_ROOT_PASSWORD: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: |
          pw="${VPS_ROOT_PASSWORD%$'\n'}"; pw="${pw%$'\r'}"
          if [ -n "$pw" ]; then echo "::add-mask::$pw"; fi
          pw_trim="$(printf '%s' "$pw" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -n "$pw_trim" ]; then echo "::add-mask::$pw_trim"; fi
          host="$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')"
          if [ -z "$host" ] || [ -z "$pw_trim" ]; then
            echo "::error::VPS_HOST / VPS_ROOT_PASSWORD সিক্রেট নেই — আগে deploy/BASE-SETUP.md-এর ধাপ ১।"
            exit 1
          fi
          if [[ "$host" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            domain="${host//./-}.sslip.io"
          else
            domain="$(printf '%s' "$host" | tr '[:upper:]' '[:lower:]')"
          fi
          if ! [[ "$domain" =~ ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$ ]]; then
            echo "::error::VPS_HOST-এ শুধু IP দিন (যেমন 169.58.58.176)।"
            exit 1
          fi
          echo "domain=$domain" >> "$GITHUB_OUTPUT"
          echo "ঠিকানা: https://$domain"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build the jar
        id: jar
        working-directory: backend
        run: |
          ./gradlew bootJar --no-daemon -q
          for j in build/libs/*.jar; do case "$j" in *-plain.jar) ;; *) cp "$j" "$RUNNER_TEMP/app.jar" ;; esac; done
          echo "sha=$(sha256sum "$RUNNER_TEMP/app.jar" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$RUNNER_TEMP/app.jar" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Settings for the app (from secrets)
        id: provided
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          SES_REGION: ${{ secrets.SES_REGION }}
          SES_ACCESS_KEY_ID: ${{ secrets.SES_ACCESS_KEY_ID }}
          SES_SECRET_ACCESS_KEY: ${{ secrets.SES_SECRET_ACCESS_KEY }}
          SES_FROM: ${{ secrets.SES_FROM }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # Sentry (প্রকল্প lifolo-server): SENTRY_DSN_BACKEND, না থাকলে পুরোনো SENTRY_DSN
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_BACKEND || secrets.SENTRY_DSN }}
          SMS_URL_TEMPLATE: ${{ secrets.SMS_URL_TEMPLATE }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        run: |
          umask 077
          f="$RUNNER_TEMP/provided.env"
          : > "$f"
          one() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          fb="$(one "$FIREBASE_SERVICE_ACCOUNT")"
          if [ -n "$fb" ]; then
            if [ "${fb:0:1}" = "{" ]; then fb="$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | base64 -w0)"; else fb="$(printf '%s' "$fb" | tr -d '\n ')"; fi
            echo "::add-mask::$fb"
            if ! printf '%s' "$fb" | base64 -d 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('private_key') and d.get('client_email') and d.get('project_id')" 2>/dev/null; then
              echo "::error::FIREBASE_SERVICE_ACCOUNT ঠিক নেই — Firebase console থেকে নামানো service account JSON পুরোটা (বা তার base64) দিন।"
              exit 1
            fi
            printf 'FIREBASE_SERVICE_ACCOUNT=%s\n' "$fb" >> "$f"
            echo "firebase=on" >> "$GITHUB_OUTPUT"
            printf '%s' "$fb" > "$RUNNER_TEMP/fb.b64"
          else
            echo "firebase=off" >> "$GITHUB_OUTPUT"
          fi
          # Sentry-র release: lifolo-server@<অ্যাপের ভার্সন>+<commit> (ওয়েব আর অ্যাপের সাথে মেলে)
          SENTRY_RELEASE="lifolo-server@$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)+${GITHUB_SHA::7}"
          # DSN-এর গঠন ভুল হলে Sentry অ্যাপ চালুই হতে দেয় না — তাই আগেই যাচাই (চাবি না দেখিয়ে কী রকম তা জানানো)
          SENTRY_DSN="$(one "$SENTRY_DSN")"
          if [ -n "$SENTRY_DSN" ] && ! [[ "$SENTRY_DSN" =~ ^https://[A-Za-z0-9]+@[a-z0-9.-]+(:[0-9]+)?/[0-9]+$ ]]; then
            shape="$(D="$SENTRY_DSN" python3 -c 'import os,re; d=os.environ["D"]; m=re.match(r"^(\w+://)([^@]*)@([^/]*)(.*)$", d); print(f"{m[1]}<key {len(m[2])} chars>@{m[3]}{m[4]}" if m else f"no @ (length {len(d)})")')"
            echo "::warning::SENTRY_DSN_BACKEND-এর গঠন ঠিক নেই ($shape) — সার্ভারে Sentry বন্ধ রাখা হলো"
            SENTRY_DSN=""
          fi
          for k in ADMIN_EMAILS SES_REGION SES_ACCESS_KEY_ID SES_SECRET_ACCESS_KEY SES_FROM R2_ACCOUNT_ID R2_ENDPOINT \
              R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET SENTRY_DSN SENTRY_RELEASE SMS_URL_TEMPLATE PUBLIC_BASE_URL; do
            v="$(one "${!k}")"
            [ -n "$v" ] || continue
            case "$v" in *$'\n'*) echo "::error::$k সিক্রেটে একাধিক লাইন — এক লাইনে দিন"; exit 1 ;; esac
            printf '%s=%s\n' "$k" "$v" >> "$f"
          done
          owner="$(one "$ADMIN_EMAILS" | cut -d, -f1 | tr -d ' ' | tr '[:upper:]' '[:lower:]')"
          echo "owner=${owner:-ekapkbd@gmail.com}" >> "$GITHUB_OUTPUT"
          echo "ses=$([ -n "$SES_REGION" ] && [ -n "$SES_FROM" ] && echo on || echo off)" >> "$GITHUB_OUTPUT"

      # ডেমোর জন্য মালিকের Firebase uid (অ্যাডমিন প্যানেলের সেশন ওই uid-এ সই হয়)। Firebase-এর ডেমো অ্যাকাউন্ট (Vercel-এর
      # Node ডেমোরও) আগে থেকে থাকলে সেগুলোই নেওয়া হয় — DEMO_KEEP_FIREBASE_USERS=true, তাই এই সার্ভার ওগুলো মোছে/বদলায় না।
      - uses: actions/setup-node@v5
        if: steps.provided.outputs.firebase == 'on' && env.IN_DEMO != 'off'
        with:
          node-version: "22"
      - name: Owner uid for the demo check
        id: owner
        if: steps.provided.outputs.firebase == 'on' && env.IN_DEMO != 'off'
        env:
          OWNER: ${{ steps.provided.outputs.owner }}
        run: |
          mkdir -p "$RUNNER_TEMP/fa" && cd "$RUNNER_TEMP/fa"
          npm init -y >/dev/null && npm i --no-audit --no-fund --silent firebase-admin@13.10.0 >/dev/null
          node - <<'JS' >> "$GITHUB_OUTPUT" || echo "uid=" >> "$GITHUB_OUTPUT"
          const admin = require(process.env.RUNNER_TEMP + '/fa/node_modules/firebase-admin');
          const fs = require('fs');
          const sa = JSON.parse(Buffer.from(fs.readFileSync(process.env.RUNNER_TEMP + '/fb.b64', 'utf8'), 'base64').toString('utf8'));
          admin.initializeApp({ credential: admin.credential.cert(sa) });
          (async () => {
            const auth = admin.auth();
            const u = await auth.getUserByEmail(process.env.OWNER).catch(() => null);
            const demo = await auth.getUser('demo-patient').catch(() => null);
            console.log(`uid=${u ? u.uid : ''}`);
            console.log(`demo_exists=${demo ? 'yes' : 'no'}`);
          })().catch((e) => { console.error(e.message); console.log('uid='); });
          JS
          rm -f "$RUNNER_TEMP/fb.b64"

      # SES-এর চাবি ঠিক কি না — কোনো ইমেইল না পাঠিয়ে: GetAccount ডাকা। IAM-এ শুধু SendEmail থাকলে AccessDenied আসে, তাতেই
      # বোঝা যায় চাবি আর সই ঠিক (ভুল চাবিতে InvalidClientTokenId / SignatureDoesNotMatch)। sandbox কি না জানা গেলে সেটাও।
      - name: SES credentials (no mail sent)
        id: ses
        if: steps.provided.outputs.ses == 'on'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SES_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.SES_REGION }}
        run: |
          out="$(aws sesv2 get-account --output json 2>&1)" && rc=0 || rc=$?
          if [ "$rc" = 0 ]; then
            prod="$(printf '%s' "$out" | python3 -c "import json,sys; print(json.load(sys.stdin).get('ProductionAccessEnabled'))" 2>/dev/null || echo '?')"
            echo "auth=ok" >> "$GITHUB_OUTPUT"
            echo "sandbox=$([ "$prod" = True ] && echo no || echo yes)" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$out" | grep -q 'AccessDenied'; then
            echo "auth=ok" >> "$GITHUB_OUTPUT"
            echo "sandbox=unknown" >> "$GITHUB_OUTPUT"
          else
            echo "auth=failed: $(printf '%s' "$out" | grep -oE '\(([A-Za-z]+)\)' | head -1)" >> "$GITHUB_OUTPUT"
            echo "sandbox=unknown" >> "$GITHUB_OUTPUT"
          fi
          echo "SES: $(printf '%s' "$out" | grep -oE '\(([A-Za-z]+)\)' | head -1)"

      - name: Connect to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_ROOT_PASSWORD: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: bash deploy/ci/vps-connect.sh

      # ক্ষমতার সেটিং আর origin-এর পাহারা — বারবার চালালেও একই (যা বদলায়নি তা ছোঁয়া হয় না); অ্যাপ restart পরের ধাপে
      - name: Tune the VPS (JVM, PostgreSQL, Redis, nginx, origin only for Cloudflare)
        id: tune
        run: |
          ssh vps "install -d -m 700 /root/lifolo-setup && cat > /root/lifolo-setup/.tune-vps.sh.\$\$ && mv /root/lifolo-setup/.tune-vps.sh.\$\$ /root/lifolo-setup/tune-vps.sh" < deploy/tune-vps.sh
          rc=0
          ssh vps 'bash /root/lifolo-setup/tune-vps.sh apply --no-app-restart' || rc=$?
          ssh vps 'cat /var/lib/lifolo/tune-status' | tr -d '\r' | grep -E '^[a-z0-9_]+=' > "$RUNNER_TEMP/tune-status.txt" || true
          sed 's/^/t_/' "$RUNNER_TEMP/tune-status.txt" >> "$GITHUB_OUTPUT"
          exit "$rc"

      # origin শুধু Cloudflare-এর জন্য খোলা — এই মেশিন থেকে সরাসরি-VPS পরীক্ষা (/etc/hosts, --resolve) SSH tunnel দিয়ে
      - name: Origin via SSH tunnel
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ip="$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')"
          if [[ "$ip" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then
            bash deploy/ci/origin-access.sh tunnel "$ip"
          else
            echo "::warning::VPS_HOST IP নয় — tunnel ছাড়া (বাইরের পরীক্ষা ব্যর্থ হতে পারে)"
          fi

      - name: Deploy on the VPS
        id: deploy
        env:
          DOMAIN: ${{ steps.host.outputs.domain }}
          SHA: ${{ steps.jar.outputs.sha }}
          OWNER_UID: ${{ steps.owner.outputs.uid }}
          OWNER: ${{ steps.provided.outputs.owner }}
          DEMO_MODE: ${{ env.IN_DEMO }}
          WEB_DOMAIN: ${{ env.IN_WEB_DOMAIN }}
          API_DOMAIN: ${{ env.IN_API_DOMAIN }}
        run: |
          extra=()
          api_domain="$(printf '%s' "$API_DOMAIN" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [ -n "$api_domain" ]; then
            [[ "$api_domain" =~ ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$ ]] || { echo "::error::api_domain ঠিক নেই"; exit 1; }
            extra=(--api-domain "$api_domain")
          fi
          ssh vps 'install -d -m 700 /root/lifolo-setup && cat > /root/lifolo-setup/deploy-backend.sh' < deploy/deploy-backend.sh
          ssh vps 'umask 077 && cat > /root/lifolo-setup/provided.env' < "$RUNNER_TEMP/provided.env"
          rm -f "$RUNNER_TEMP/provided.env"
          ssh vps 'umask 077 && cat > /root/lifolo-setup/app.jar.new' < "$RUNNER_TEMP/app.jar"
          demo=()
          if [ -n "$OWNER_UID" ] && [[ "$DEMO_MODE" =~ ^(keep|smoke)$ ]] && [[ "$OWNER_UID" =~ ^[A-Za-z0-9_-]+$ ]] && [[ "$OWNER" =~ ^[a-z0-9._%+-]+@[a-z0-9.-]+$ ]]; then
            demo=(--demo "$DEMO_MODE" "$OWNER_UID" "$OWNER")
          fi
          web_domain="$(printf '%s' "$WEB_DOMAIN" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [ -n "$web_domain" ]; then
            [[ "$web_domain" =~ ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$ ]] || { echo "::error::web_domain ঠিক নেই"; exit 1; }
            extra+=(--web-domain "$web_domain")
          fi
          rc=0
          # shellcheck disable=SC2029  # মানগুলো ওপরে কড়া যাচাই করা
          ssh vps "bash /root/lifolo-setup/deploy-backend.sh --ci --domain '$DOMAIN' --jar /root/lifolo-setup/app.jar.new --sha256 '$SHA' --provided /root/lifolo-setup/provided.env ${extra[*]} ${demo[*]}" || rc=$?
          ssh vps 'cat /var/lib/lifolo/deploy-status' | tr -d '\r' | grep -E '^[a-z0-9_]+=' > "$RUNNER_TEMP/deploy-status.txt" || true
          cat "$RUNNER_TEMP/deploy-status.txt"
          sed 's/^/s_/' "$RUNNER_TEMP/deploy-status.txt" >> "$GITHUB_OUTPUT"
          exit "$rc"

      # ওয়েবসাইট: Vue ওয়েব (dist → /w/) + Vue অ্যাডমিন (dist-admin → /admin/) + server/public-এর বাকি ফাইল (থাকলে)
      - uses: actions/setup-node@v5
        if: env.IN_WEB_DOMAIN != ''
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-vue/package-lock.json
      - name: Build the website (web-vue)
        id: site
        if: env.IN_WEB_DOMAIN != ''
        env:
          # Sentry (প্রকল্প lifolo-web): DSN বিল্ডে ঢোকে (ব্রাউজারে পাঠানোর ঠিকানা — গোপন নয়); খালি = বন্ধ
          SENTRY_DSN_WEB: ${{ secrets.SENTRY_DSN_WEB }}
        run: |
          dsn="$(printf '%s' "$SENTRY_DSN_WEB" | tr -d '[:space:]')"
          host=""
          if [[ "$dsn" =~ ^https://[A-Za-z0-9]+@([a-z0-9.-]+\.sentry\.io)/[0-9]+$ ]]; then
            host="${BASH_REMATCH[1]}"
          elif [ -n "$dsn" ]; then
            echo "::warning::SENTRY_DSN_WEB ঠিক নেই (https://<key>@<…>.sentry.io/<id>) — ওয়েবে Sentry বন্ধ"; dsn=""
          fi
          echo "sentry_host=$host" >> "$GITHUB_OUTPUT"
          export VITE_SENTRY_DSN="$dsn"
          export VITE_SENTRY_RELEASE="lifolo-web@$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)+${GITHUB_SHA::7}"
          (cd web-vue && npm ci --no-audit --no-fund && npm run build)
          site="$RUNNER_TEMP/site"
          rm -rf "$site" && mkdir -p "$site"
          cp -R web-vue/dist "$site/w"
          cp -R web-vue/dist-admin "$site/admin"
          for f in server/public/*; do
            case "$(basename "$f")" in w|admin) ;; *) cp -R "$f" "$site/" ;; esac
          done
          # /privacy আর /terms — PRIVACY.md / TERMS.md থেকে (GitHub-এর blob লিংকের বদলে; রিপো private হলেও খোলে)
          python3 deploy/ci/render-legal.py PRIVACY.md "$site/privacy/index.html" --kind privacy
          python3 deploy/ci/render-legal.py TERMS.md "$site/terms/index.html" --kind terms
          tar -czf "$RUNNER_TEMP/site.tar.gz" -C "$site" .
          echo "sha=$(sha256sum "$RUNNER_TEMP/site.tar.gz" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$RUNNER_TEMP/site.tar.gz" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "asset=$(grep -oE '/w/assets/[A-Za-z0-9._-]+[.]js' "$site/w/index.html" | head -1)" >> "$GITHUB_OUTPUT"

      - name: Website on the VPS (deploy-web.sh)
        id: webdeploy
        if: steps.site.outcome == 'success' && steps.deploy.outcome == 'success'
        env:
          SHA: ${{ steps.site.outputs.sha }}
          WEB_DOMAIN: ${{ env.IN_WEB_DOMAIN }}
          WEB_CERT: ${{ env.IN_WEB_CERT }}
          SENTRY_HOST: ${{ steps.site.outputs.sentry_host }}
        run: |
          nocert=""
          [ "$WEB_CERT" != false ] || nocert="--no-cert"
          [ -z "$SENTRY_HOST" ] || nocert="$nocert --sentry-host $SENTRY_HOST"
          web_domain="$(printf '%s' "$WEB_DOMAIN" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$web_domain" =~ ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$ ]] || { echo "::error::web_domain ঠিক নেই"; exit 1; }
          ssh vps 'cat > /root/lifolo-setup/deploy-web.sh' < deploy/deploy-web.sh
          ssh vps 'umask 077 && cat > /root/lifolo-setup/site.tar.gz' < "$RUNNER_TEMP/site.tar.gz"
          rc=0
          # shellcheck disable=SC2029  # মানগুলো ওপরে কড়া যাচাই করা
          ssh vps "bash /root/lifolo-setup/deploy-web.sh --ci --site /root/lifolo-setup/site.tar.gz --sha256 '$SHA' --web-domain '$web_domain' $nocert" || rc=$?
          ssh vps 'cat /var/lib/lifolo/deploy-web-status' | tr -d '\r' | grep -E '^[a-z0-9_]+=' > "$RUNNER_TEMP/deploy-web-status.txt" || true
          cat "$RUNNER_TEMP/deploy-web-status.txt"
          sed 's/^/w_/' "$RUNNER_TEMP/deploy-web-status.txt" >> "$GITHUB_OUTPUT"
          fails="$(grep -E '^t_[a-z_]+=failed' "$RUNNER_TEMP/deploy-web-status.txt" | cut -d= -f1 | tr '\n' ' ' || true)"
          echo "fails=$fails" >> "$GITHUB_OUTPUT"
          [ "$rc" = 0 ] || exit "$rc"
          if grep -qE '^site=(nginx_failed|cert_failed)' "$RUNNER_TEMP/deploy-web-status.txt" || [ -n "$fails" ]; then exit 1; fi

      # Cloudflare origin-এ পৌঁছায় কি না (ufw-এ শুধু Cloudflare খোলা): VPS থেকেই Cloudflare-এর ঠিকানা হয়ে নিজের কাছে।
      # 521/522/523 = Cloudflare origin-এ ঢুকতে পারছে না → সাইট বন্ধ হওয়ার ঝুঁকি: তখন জরুরি দরজা খোলা (80/443 সবার জন্য,
      # /etc/lifolo/origin-open) আর workflow ব্যর্থ (ইমেইল)। challenge (403/429/503) হলে শুধু জানানো।
      - name: Cloudflare reaches the origin (checked from the VPS)
        id: cforigin
        if: always() && steps.tune.outcome != 'skipped' && env.IN_WEB_DOMAIN != ''
        env:
          WEB_DOMAIN: ${{ env.IN_WEB_DOMAIN }}
        run: |
          d="$(printf '%s' "$WEB_DOMAIN" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$d" =~ ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$ ]] || exit 0
          # shellcheck disable=SC2029  # নাম ওপরে যাচাই করা
          if ! ssh vps "getent ahostsv4 '$d' | awk '{print \$1}' | sort -u | grep -qE '^(104\.(1[6-9]|2[0-9]|3[01])|172\.(6[4-9]|7[01])|188\.114|162\.15[89]|141\.101|108\.162|173\.245|190\.93|197\.234|198\.41|103\.2[12]|103\.31|131\.0)\.'"; then
            echo "result=not_cloudflare" >> "$GITHUB_OUTPUT"; echo "$d Cloudflare-এর পেছনে নয় — পরীক্ষা নেই"; exit 0
          fi
          code=000
          for _ in 1 2 3 4 5; do
            code="$(ssh vps "curl -sS -m 20 -o /dev/null -w '%{http_code}' 'https://$d/api/health'" 2>/dev/null || echo 000)"
            [ "$code" = 200 ] && break
            sleep 5
          done
          echo "code=$code"
          case "$code" in
            200) echo "result=ok" >> "$GITHUB_OUTPUT" ;;
            403|429|503) echo "result=challenge ($code)" >> "$GITHUB_OUTPUT"; echo "::warning::Cloudflare VPS-কে challenge দিল ($code) — origin-এর পথ নিশ্চিত হওয়া গেল না" ;;
            52[0-6])
              echo "result=failed ($code) — origin opened" >> "$GITHUB_OUTPUT"
              ssh vps 'touch /etc/lifolo/origin-open && /usr/local/sbin/lifolo-tune firewall' || true
              echo "::error::Cloudflare origin-এ ঢুকতে পারছে না (HTTP $code) — 80/443 সবার জন্য খুলে দেওয়া হলো (/etc/lifolo/origin-open). Cloudflare-এর ঠিকানার তালিকা দেখে ফাইলটা মুছে আবার deploy করুন।"
              exit 1 ;;
            *) echo "result=unknown ($code)" >> "$GITHUB_OUTPUT"; echo "::warning::Cloudflare দিয়ে HTTP $code" ;;
          esac

      # ওয়েবসাইট আর ডেমো — ইন্টারনেট থেকে (সত্যিকারের DNS আর সার্টিফিকেট দিয়ে)
      # Cloudflare-এর proxy (কমলা মেঘ) চালু: GitHub-এর মেশিন ডেটাসেন্টারের ঠিকানা, Cloudflare কখনো কখনো এদের challenge/403 দেয়।
      # তাই ১) একবার আসল পথে (Cloudflare দিয়ে) — challenge হলে শুধু জানানো, ব্যর্থ নয়; ২) বাকি সব পরীক্ষা সরাসরি VPS-এ
      # (/etc/hosts-এ নাম → VPS-এর IP, সত্যিকারের নাম আর সার্টিফিকেট দিয়েই — Cloudflare মাঝে নেই; origin শুধু Cloudflare-এর
      # জন্য খোলা বলে VPS-এর IP-তে যাওয়া সংযোগ SSH tunnel দিয়ে যায় — আগের "Origin via SSH tunnel" ধাপ)।
      - name: Check the website and the demo from the internet
        id: inet
        if: always() && steps.deploy.outcome == 'success'
        env:
          WEB_DOMAIN: ${{ env.IN_WEB_DOMAIN }}
          API_DOMAIN: ${{ env.IN_API_DOMAIN }}
          SITE_OK: ${{ steps.webdeploy.outputs.w_site }}
          WWW_OK: ${{ steps.webdeploy.outputs.w_www }}
          ASSET: ${{ steps.site.outputs.asset }}
          DEMO_MODE: ${{ env.IN_DEMO }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          rc=0
          res() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "$1=$2"; }
          # ১) আসল পথে একবার (ব্যবহারকারীরা যেভাবে আসে)
          if [ -n "$WEB_DOMAIN" ]; then
            code="$(curl -sS -m 20 -o "$RUNNER_TEMP/pub.txt" -D "$RUNNER_TEMP/pub.hdr" -w '%{http_code}' "https://$WEB_DOMAIN/api/health" 2>/dev/null || echo 000)"
            via="$(tr -d '\r' < "$RUNNER_TEMP/pub.hdr" 2>/dev/null | grep -qi '^cf-ray:' && echo cloudflare || echo direct)"
            if [ "$code" = 200 ] && grep -q '"ok":true' "$RUNNER_TEMP/pub.txt"; then
              res public "ok ($via)"
            elif [ "$via" = cloudflare ] && { [ "$code" = 403 ] || [ "$code" = 503 ] || [ "$code" = 429 ]; }; then
              res public "cloudflare_challenge (HTTP $code$(tr -d '\r' < "$RUNNER_TEMP/pub.hdr" | grep -i '^cf-mitigated:' | sed 's/^/, /'))"
              echo "::warning::Cloudflare GitHub-এর মেশিনকে আটকেছে (HTTP $code) — সাইট চালু; বাকি পরীক্ষা সরাসরি VPS-এ"
            else
              res public "failed (HTTP $code, $via)"; rc=1
            fi
          fi
          # ২) বাকি সব সরাসরি VPS-এ
          ip="$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')"
          if [[ "$ip" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then
            echo "$ip $WEB_DOMAIN www.$WEB_DOMAIN $API_DOMAIN # lifolo-origin" | sudo tee -a /etc/hosts >/dev/null
          fi
          if [ "$SITE_OK" = ok ]; then
            B="https://$WEB_DOMAIN"
            curl -fsS -m 15 "$B/" | grep -q '/w/assets/' && res web_root ok || { res web_root failed; rc=1; }
            curl -fsS -m 15 "$B/api/health" | grep -q '"ok":true' && res web_api ok || { res web_api failed; rc=1; }
            curl -fsS -m 15 -o /dev/null -D - "$B$ASSET" | tr -d '\r' | grep -qi '^cache-control: public, max-age=31536000, immutable' && res web_cache ok || { res web_cache failed; rc=1; }
            curl -fsS -m 15 -o /dev/null -D - "$B/admin/" | tr -d '\r' | grep -qi "^content-security-policy: default-src 'none'" && res web_admin ok || { res web_admin failed; rc=1; }
            curl -fsS -m 15 "$B/privacy" | grep -q 'Privacy Policy' && curl -fsS -m 15 "$B/terms" | grep -q 'Terms of Use' && res web_legal ok || { res web_legal failed; rc=1; }
            if [ "$WWW_OK" = ok ]; then
              curl -sS -m 15 -o /dev/null -w '%{http_code} %{redirect_url}' "https://www.$WEB_DOMAIN/x" | grep -q "^301 https://$WEB_DOMAIN/x" && res web_www ok || { res web_www failed; rc=1; }
            fi
          fi
          # ডেমো: api.lifolo.com দিয়ে লগইন (রোগী, ফার্মেসি) আর কয়েকটা পড়া
          if [ "$DEMO_MODE" = keep ] && [ -n "$API_DOMAIN" ]; then
            out="$(API="https://$API_DOMAIN" KEY="$(python3 -c "import json;print(json.load(open('app/google-services.json'))['client'][0]['api_key'][0]['current_key'])")" python3 deploy/ci/demo-smoke.py 2>&1)" && drc=0 || drc=$?
            echo "$out"
            res demo_api "$(printf '%s' "$out" | tail -1)"
            [ "$drc" = 0 ] || rc=1
          fi
          exit "$rc"

      - name: Check from the internet - https://<address>/api/health
        id: web
        if: always() && steps.host.outputs.domain != ''
        env:
          DOMAIN: ${{ steps.host.outputs.domain }}
          API_DOMAIN: ${{ env.IN_API_DOMAIN }}
          S_API_DOMAIN: ${{ steps.deploy.outputs.s_api_domain }}
        run: |
          api=no; healthz=no
          for _ in $(seq 1 10); do
            if curl -fsS -m 10 "https://$DOMAIN/api/health" | grep -q '"ok":true'; then api=yes; break; fi
            sleep 6
          done
          curl -fsS -m 10 "https://$DOMAIN/healthz" | grep -q '"ok":true' && healthz=yes
          echo "api=$api" >> "$GITHUB_OUTPUT"
          if [ "$S_API_DOMAIN" = ok ]; then
            d2=no
            for _ in $(seq 1 5); do
              if curl -fsS -m 10 "https://$API_DOMAIN/api/health" | grep -q '"ok":true'; then d2=yes; break; fi
              sleep 6
            done
            echo "api2=$d2" >> "$GITHUB_OUTPUT"
            echo "https://$API_DOMAIN/api/health: $d2"
          fi
          echo "healthz=$healthz" >> "$GITHUB_OUTPUT"
          echo "https://$DOMAIN/api/health: $api   /healthz: $healthz"
          [ "$api" = yes ]

      - name: Summary
        if: always()
        env:
          DOMAIN: ${{ steps.host.outputs.domain }}
          JOB_OK: ${{ job.status }}
          JAR_SHA: ${{ steps.jar.outputs.sha }}
          JAR_SIZE: ${{ steps.jar.outputs.size }}
          FIREBASE: ${{ steps.provided.outputs.firebase }}
          SES: ${{ steps.provided.outputs.ses }}
          OWNER_UID: ${{ steps.owner.outputs.uid }}
          DEMO_EXISTS: ${{ steps.owner.outputs.demo_exists }}
          DEMO_INPUT: ${{ env.IN_DEMO }}
          DEMO_API: ${{ steps.inet.outputs.demo_api }}
          S_KEEP_FB: ${{ steps.deploy.outputs.s_demo_keep_firebase_users }}
          S_BASE_URL: ${{ steps.deploy.outputs.s_public_base_url }}
          WEB_DOMAIN: ${{ env.IN_WEB_DOMAIN }}
          SITE_OUTCOME: ${{ steps.site.outcome }}
          SITE_SIZE: ${{ steps.site.outputs.size }}
          WEB_OUTCOME: ${{ steps.webdeploy.outcome }}
          W_SITE: ${{ steps.webdeploy.outputs.w_site }}
          W_WWW: ${{ steps.webdeploy.outputs.w_www }}
          W_DNS_APEX: ${{ steps.webdeploy.outputs.w_dns_apex }}
          W_DNS_WWW: ${{ steps.webdeploy.outputs.w_dns_www }}
          W_RELEASE: ${{ steps.webdeploy.outputs.w_release }}
          W_PREV: ${{ steps.webdeploy.outputs.w_previous }}
          W_REALIP: ${{ steps.webdeploy.outputs.w_realip }}
          W_DNS_APEX_V: ${{ steps.webdeploy.outputs.w_dns_apex }}
          W_ACME_CF: ${{ steps.webdeploy.outputs.w_acme_via_cloudflare }}
          W_CERT_EXP: ${{ steps.webdeploy.outputs.w_cert_expires }}
          W_CERT_ERROR: ${{ steps.webdeploy.outputs.w_cert_error }}
          W_DNS_DIAG: ${{ steps.webdeploy.outputs.w_dns_diag }}
          W_FAILS: ${{ steps.webdeploy.outputs.fails }}
          I_ROOT: ${{ steps.inet.outputs.web_root }}
          I_API: ${{ steps.inet.outputs.web_api }}
          I_CACHE: ${{ steps.inet.outputs.web_cache }}
          I_ADMIN: ${{ steps.inet.outputs.web_admin }}
          I_WWW: ${{ steps.inet.outputs.web_www }}
          I_LEGAL: ${{ steps.inet.outputs.web_legal }}
          I_PUBLIC: ${{ steps.inet.outputs.public }}
          WEB_API: ${{ steps.web.outputs.api }}
          WEB_HEALTHZ: ${{ steps.web.outputs.healthz }}
          S_APP: ${{ steps.deploy.outputs.s_app }}
          S_FLYWAY: ${{ steps.deploy.outputs.s_flyway }}
          S_ROLLBACK: ${{ steps.deploy.outputs.s_rollback }}
          S_NGINX: ${{ steps.deploy.outputs.s_nginx }}
          S_HEALTH_HTTPS: ${{ steps.deploy.outputs.s_health_https }}
          S_HEALTHZ: ${{ steps.deploy.outputs.s_healthz }}
          S_ASSETLINKS: ${{ steps.deploy.outputs.s_assetlinks }}
          S_SHARE: ${{ steps.deploy.outputs.s_share_route }}
          S_JOBRUNR: ${{ steps.deploy.outputs.s_jobrunr_off }}
          S_ACTUATOR: ${{ steps.deploy.outputs.s_actuator_hidden }}
          S_APIDOCS: ${{ steps.deploy.outputs.s_apidocs_hidden }}
          S_GUEST: ${{ steps.deploy.outputs.s_api_guest }}
          S_DEMO_SEED: ${{ steps.deploy.outputs.s_demo_seed }}
          S_DEMO_WIPE: ${{ steps.deploy.outputs.s_demo_wipe }}
          S_FATAL: ${{ steps.deploy.outputs.s_fatal }}
          S_R2: ${{ steps.deploy.outputs.s_r2 }}
          S_SES_CLIENT: ${{ steps.deploy.outputs.s_ses_client }}
          SES_AUTH: ${{ steps.ses.outputs.auth }}
          SES_SANDBOX: ${{ steps.ses.outputs.sandbox }}
          API_DOMAIN: ${{ env.IN_API_DOMAIN }}
          S_API_DOMAIN: ${{ steps.deploy.outputs.s_api_domain }}
          S_API_DOMAIN_HEALTH: ${{ steps.deploy.outputs.s_api_domain_health }}
          WEB_API2: ${{ steps.web.outputs.api2 }}
          S_SENTRY: ${{ steps.deploy.outputs.s_sentry }}
          S_RATE_LIMIT: ${{ steps.deploy.outputs.s_rate_limit }}
          S_RATE_JSON: ${{ steps.deploy.outputs.s_rate_limit_json }}
          S_RATE_PROBE: ${{ steps.deploy.outputs.s_rate_limit_probe }}
          S_KEEPALIVE: ${{ steps.deploy.outputs.s_nginx_keepalive }}
          T_JVM: ${{ steps.tune.outputs.t_jvm }}
          T_PG: ${{ steps.tune.outputs.t_pg_settings }}
          T_PG_STATE: ${{ steps.tune.outputs.t_postgres }}
          T_REDIS: ${{ steps.tune.outputs.t_redis }}
          T_NGINX: ${{ steps.tune.outputs.t_nginx }}
          T_FIREWALL: ${{ steps.tune.outputs.t_firewall }}
          T_CF: ${{ steps.tune.outputs.t_cf_ranges }}
          T_GUARD: ${{ steps.tune.outputs.t_guard_timer }}
          T_DONE: ${{ steps.tune.outputs.t_finished }}
          CF_ORIGIN: ${{ steps.cforigin.outputs.result }}
        run: |
          mark() { case "$1" in ok|yes|up|ok\ *|kept*) echo "✅" ;; skipped*|"") echo "⏭️" ;; *) echo "❌" ;; esac; }
          row() { echo "| $1 | $(mark "$2") | ${3:-$2} |"; }
          {
            if [ "$JOB_OK" = success ]; then echo "## ✅ ব্যাকএন্ড চালু হয়েছে"; else echo "## ❌ deploy পুরো হয়নি"; fi
            echo
            echo "ঠিকানা: **https://$DOMAIN/api/health** · jar \`${JAR_SHA:0:12}\` ($JAR_SIZE) · commit \`${GITHUB_SHA:0:7}\` (${GITHUB_REF_NAME})"
            [ -z "$S_FATAL" ] || { echo; echo "> থেমেছে: $S_FATAL"; }
            echo
            echo "| পরীক্ষা | ফল | বিস্তারিত |"
            echo "|---|---|---|"
            row "অ্যাপ চালু (/api/health, VPS-এর ভেতরে)" "$S_APP" "${S_APP:-—}"
            row "ডাটাবেস migration (Flyway)" "$([ -n "$S_FLYWAY" ] && echo ok)" "${S_FLYWAY:-—}"
            [ -z "$S_ROLLBACK" ] || row "আগের jar-এ ফেরা" "$S_ROLLBACK"
            row "nginx: /api/ /r/ /rx/ /shop/ /.well-known/ → অ্যাপ" "$S_NGINX" "${S_NGINX:-—}"
            row "https://$DOMAIN/api/health (VPS থেকে)" "$S_HEALTH_HTTPS" "${S_HEALTH_HTTPS:-—}"
            row "https://$DOMAIN/api/health (ইন্টারনেট থেকে)" "$WEB_API" "${WEB_API:-—}"
            if [ -n "$API_DOMAIN" ]; then
              case "$S_API_DOMAIN" in
                ok) row "https://$API_DOMAIN — সার্টিফিকেট + nginx" ok
                    row "https://$API_DOMAIN/api/health (VPS থেকে)" "$S_API_DOMAIN_HEALTH" "${S_API_DOMAIN_HEALTH:-—}"
                    row "https://$API_DOMAIN/api/health (ইন্টারনেট থেকে)" "$WEB_API2" "${WEB_API2:-—}" ;;
                dns_not_ready*) row "https://$API_DOMAIN" skipped "DNS এখনো এই VPS-এ (বা Cloudflare-এ) যায় না (${S_API_DOMAIN#dns_not_ready }) — Cloudflare-এ A রেকর্ড দিয়ে আবার চালান" ;;
                *) row "https://$API_DOMAIN" "${S_API_DOMAIN:-failed}" ;;
              esac
            fi
            row "/healthz আগের মতোই" "$S_HEALTHZ" "${S_HEALTHZ:-—}"
            row "nginx → অ্যাপ: খোলা সংযোগ রাখা (upstream keepalive 64)" "$S_KEEPALIVE" "${S_KEEPALIVE:-—}"
            row "/api/-এ IP-প্রতি সীমা (২০/সে, burst ৪০) → 429 JSON" "$([ "$S_RATE_JSON" = ok ] && echo ok || echo "${S_RATE_JSON:-${S_RATE_LIMIT:-—}}")" "${S_RATE_LIMIT:-—}${S_RATE_PROBE:+ · পরীক্ষা: $S_RATE_PROBE}"
            row "/.well-known/assetlinks.json" "$S_ASSETLINKS" "${S_ASSETLINKS:-—}"
            row "/r/… শেয়ার পাতা অ্যাপ থেকে" "$S_SHARE" "${S_SHARE:-—}"
            row "অতিথির API (/api/community)" "$S_GUEST" "${S_GUEST:-—}"
            row "JobRunr dashboard বাইরে বন্ধ" "$S_JOBRUNR" "${S_JOBRUNR:-—}"
            row "/actuator বাইরে বন্ধ" "$S_ACTUATOR" "${S_ACTUATOR:-—}"
            row "/api/docs (OpenAPI) বাইরে বন্ধ" "$S_APIDOCS" "${S_APIDOCS:-—}"
            if [ "$SES" = on ]; then
              row "SES-এর চাবি (ইমেইল না পাঠিয়ে)" "${SES_AUTH:-failed}" "${SES_AUTH:-—}"
              row "অ্যাপে SES client চালু" "${S_SES_CLIENT:-failed}" "${S_SES_CLIENT:-—}"
            else
              row "ইমেইল (SES)" skipped "সিক্রেট নেই"
            fi
            if [ "$FIREBASE" != on ]; then
              row "ডেমো বানানো → মোছা" "skipped" "Firebase নেই"
            elif [ "$DEMO_INPUT" = off ]; then
              row "ডেমো" "skipped" "চালানোর সময় বন্ধ রাখা হয়েছে"
            elif [ -z "$OWNER_UID" ]; then
              row "ডেমো" "failed" "মালিকের Firebase অ্যাকাউন্ট পাওয়া যায়নি"
            else
              row "ডেমো বানানো (গাজীপুর, API দিয়ে)" "$S_DEMO_SEED"
              if [ "$DEMO_INPUT" = smoke ]; then row "ডেমো মোছা (API দিয়ে)" "$S_DEMO_WIPE"; fi
              [ -z "$DEMO_API" ] || row "ডেমো লগইন + পড়া (https://$API_DOMAIN, ইন্টারনেট থেকে)" "$DEMO_API"
              row "Firebase-এর ডেমো অ্যাকাউন্ট রাখা (Vercel-এর ডেমোর জন্য)" "$([ "$S_KEEP_FB" = true ] && echo ok || echo "${S_KEEP_FB:-—}")" "DEMO_KEEP_FIREBASE_USERS=${S_KEEP_FB:-?}"
            fi
            if [ -n "$WEB_DOMAIN" ]; then
              echo
              echo "**ওয়েবসাইট — https://$WEB_DOMAIN** (Vue ওয়েব /w/, অ্যাডমিন /admin/, /api → এই সার্ভার)"
              echo
              echo "| পরীক্ষা | ফল | বিস্তারিত |"
              echo "|---|---|---|"
              row "ওয়েব বিল্ড (web-vue)" "$([ "$SITE_OUTCOME" = success ] && echo ok || echo "${SITE_OUTCOME:-skipped}")" "${SITE_SIZE:-—}"
              case "$W_SITE" in
                ok) row "https://$WEB_DOMAIN — সার্টিফিকেট + nginx" ok "রিলিজ ${W_RELEASE:-?}${W_PREV:+ (আগেরটা $W_PREV)}"
                    if [ "$W_WWW" = ok ]; then row "https://www.$WEB_DOMAIN → https://$WEB_DOMAIN" ok
                    else row "www.$WEB_DOMAIN" skipped "DNS এখনো এই VPS-এ (বা Cloudflare-এ) আসে না (${W_DNS_WWW:-?}) — Cloudflare-এ CNAME www → $WEB_DOMAIN দিয়ে আবার চালান"; fi
                    row "VPS-এর ভেতরের পথ/হেডার পরীক্ষা (ডাউনলোড, /privacy, /terms সহ)" "$([ -z "$W_FAILS" ] && [ "$WEB_OUTCOME" = success ] && echo ok || echo "failed: $W_FAILS")"
                    row "সরাসরি VPS-এ (আসল নাম + সার্টিফিকেট): পাতা (/)" "$I_ROOT" "${I_ROOT:-—}"
                    row "ইন্টারনেট থেকে: /api/health একই ঠিকানায়" "$I_API" "${I_API:-—}"
                    row "ইন্টারনেট থেকে: /w/assets/ এক বছর cache" "$I_CACHE" "${I_CACHE:-—}"
                    row "ইন্টারনেট থেকে: /admin/ কড়া CSP" "$I_ADMIN" "${I_ADMIN:-—}"
                    row "ইন্টারনেট থেকে: /privacy আর /terms" "$I_LEGAL" "${I_LEGAL:-—}"
                    case "$I_PUBLIC" in
                      ok*) row "আসল পথে (Cloudflare দিয়ে) /api/health" ok "$I_PUBLIC" ;;
                      cloudflare_challenge*) row "আসল পথে (Cloudflare দিয়ে) /api/health" skipped "$I_PUBLIC — GitHub-এর মেশিনকে Cloudflare আটকায়; সাইট চালু (সরাসরি VPS-এ সব ঠিক)" ;;
                      *) row "আসল পথে (Cloudflare দিয়ে) /api/health" "${I_PUBLIC:-failed}" ;;
                    esac
                    [ -z "$I_WWW" ] || row "ইন্টারনেট থেকে: www → $WEB_DOMAIN" "$I_WWW"
                    row "Cloudflare-এর আসল IP (CF-Connecting-IP)" "$W_REALIP" "${W_REALIP:-—}"
                    if [ "$W_DNS_APEX_V" = cloudflare ]; then
                      row "Cloudflare-এর proxy চালু (কমলা মেঘ)" ok "সার্টিফিকেট (VPS) মেয়াদ: ${W_CERT_EXP:-?}"
                      row "Let's Encrypt-এর নবায়নের পথ (Cloudflare দিয়ে /.well-known/acme-challenge/)" "$W_ACME_CF" "${W_ACME_CF:-—}"
                    fi
                    [ -z "$W_CERT_ERROR" ] || row "সার্টিফিকেটের আগের চেষ্টা" skipped "$W_CERT_ERROR" ;;
                dns_not_ready*)
                    row "https://$WEB_DOMAIN" skipped "DNS এখনো এই VPS-এ আসে না (${W_DNS_APEX:-?})"
                    echo
                    echo "> ⏭️ **$WEB_DOMAIN এখনো এই VPS-এ আসে না** — Cloudflare-এ A রেকর্ড \`@\` → VPS-এর IP আর CNAME \`www\` → \`$WEB_DOMAIN\` (ধূসর বা কমলা মেঘ — দুটোই চলে) দিয়ে কয়েক মিনিট পর আবার চালান। ওয়েবের ফাইল VPS-এ রাখা আছে; কিছু ভাঙেনি।" ;;
                "") row "https://$WEB_DOMAIN" "${WEB_OUTCOME:-skipped}" "বসানো হয়নি (আগের ধাপ ব্যর্থ?)" ;;
                *) row "https://$WEB_DOMAIN" "$W_SITE" "$W_SITE${W_CERT_ERROR:+ — $W_CERT_ERROR}"
                   [ -z "$W_DNS_DIAG" ] || row "DNS (বাইরের resolver থেকে)" skipped "$W_DNS_DIAG" ;;
              esac
            fi
            echo
            echo "**VPS-এর সেটিং (tune-vps.sh):**"
            echo
            echo "| কী | ফল | বিস্তারিত |"
            echo "|---|---|---|"
            row "JVM (-Xms1g -Xmx3g, G1)" "$([ "$T_DONE" = yes ] && echo ok || echo "${T_JVM:-failed}")" "${T_JVM:-—}"
            row "PostgreSQL" "$([ -n "$T_PG" ] && echo ok || echo "${T_PG_STATE:-failed}")" "${T_PG:-—} (${T_PG_STATE:-?})"
            row "Redis" "$([[ "$T_REDIS" == 536870912\ volatile-lru ]] && echo ok || echo "${T_REDIS:-failed}")" "${T_REDIS:-—}"
            row "nginx (worker_connections 4096, nofile 16384)" "$([[ "$T_NGINX" == ok* ]] && echo ok || echo "${T_NGINX:-failed}")" "${T_NGINX:-—}"
            row "origin: 80/443 শুধু Cloudflare (ufw), 22 খোলা" "$([[ "$T_FIREWALL" == cloudflare-only* ]] && echo ok || echo "${T_FIREWALL:-failed}")" "${T_FIREWALL:-—} · তালিকা: ${T_CF:-—} · guard timer: ${T_GUARD:-—}"
            [ -z "$CF_ORIGIN" ] || row "Cloudflare → origin (VPS থেকে যাচাই)" "$CF_ORIGIN" "$CF_ORIGIN"
            echo
            echo "শেয়ার লিংক/QR-এর ঠিকানা (PUBLIC_BASE_URL): \`${S_BASE_URL:-—}\`"
            echo
            echo "**সেটিং:**"
            if [ "$FIREBASE" = on ]; then
              echo "- ✅ Firebase (লগইন আর পুশ) চালু।"
            else
              echo "- ⚠️ **FIREBASE_SERVICE_ACCOUNT সিক্রেট নেই — অ্যাপ চলছে, কিন্তু পুশ বন্ধ (PUSH_MODE=log) আর কেউ লগইন করতে পারবে না।** সিক্রেট যোগ করে আবার চালান।"
            fi
            if [ "$SES" = on ]; then
              echo "- ✅ ইমেইল (Amazon SES) চালু।"
              if [ "$SES_SANDBOX" != no ]; then echo "- ⚠️ SES সম্ভবত এখনো sandbox-এ — শুধু যাচাই করা ঠিকানায় ইমেইল যায়। AWS-এ production access অনুমোদনের পর সবার কাছে যাবে।"; fi
            else
              echo "- ⚠️ SES সিক্রেট নেই — লগইন-কোডের ইমেইল যায় না (কোড শুধু VPS-এর লগে)।"
            fi
            echo "- R2 (ছবি): $([ "$S_R2" = on ] && echo চালু || echo 'বন্ধ (ঐচ্ছিক)') · Sentry: $([ "$S_SENTRY" = on ] && echo চালু || echo 'বন্ধ (ঐচ্ছিক)')"
            echo "- JobRunr dashboard সবসময় বন্ধ; অ্যাপ শুধু 127.0.0.1:8080-এ শোনে, বাইরে থেকে nginx দিয়েই।"
            echo "- ২.৩৪.০ থেকে ফোনের অ্যাপ এই সার্ভারে (https://lifolo.com)। পুরোনো সংস্করণের অ্যাপ এখনো Vercel-এ যায় (Vercel চালু রাখা) — বাকি ধাপ: deploy/CUTOVER.md"
            if [ "$JOB_OK" != success ]; then
              echo
              echo "ব্যর্থ হলে: বাঁ দিকে **deploy** → লাল ✗ চিহ্নের ধাপ খুলে স্ক্রিনশট Claude-কে পাঠান (গোপন মান লগে \`***\`)।"
            fi
          } > "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to the log branch (ci-log-deploy)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          LOG_MESSAGE: deploy ${{ github.sha }} ${{ job.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/log"
          cp "$RUNNER_TEMP/summary.md" "$RUNNER_TEMP/log/summary.md" 2>/dev/null || true
          { echo "commit=${GITHUB_SHA}"; echo "branch=${GITHUB_REF_NAME}"; echo "job=${{ job.status }}"; echo "run=${GITHUB_RUN_ID}"; cat "$RUNNER_TEMP/deploy-status.txt" 2>/dev/null || true; } > "$RUNNER_TEMP/log/deploy-status.txt"
          cp "$RUNNER_TEMP/deploy-web-status.txt" "$RUNNER_TEMP/log/deploy-web-status.txt" 2>/dev/null || : > "$RUNNER_TEMP/log/deploy-web-status.txt"
          cp "$RUNNER_TEMP/tune-status.txt" "$RUNNER_TEMP/log/tune-status.txt" 2>/dev/null || : > "$RUNNER_TEMP/log/tune-status.txt"
          bash .github/scripts/publish-log.sh ci-log-deploy "$RUNNER_TEMP/log" summary.md deploy-status.txt deploy-web-status.txt tune-status.txt

      - name: Clean up
        if: always()
        run: |
          ssh -O exit vps 2>/dev/null || true
          sudo sed -i '/# lifolo-origin$/d' /etc/hosts || true
          rm -rf ~/.ssh/lifolo ~/.ssh/config "$RUNNER_TEMP/provided.env" "$RUNNER_TEMP/fb.b64" "$RUNNER_TEMP/fa" "$RUNNER_TEMP/site" "$RUNNER_TEMP/site.tar.gz"
