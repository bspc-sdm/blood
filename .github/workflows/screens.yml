name: UI screenshots

# স্ক্রিনগুলোর ছবি (Robolectric) — ফল "screens" শাখায়
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Run screenshot tests
        run: |
          set -o pipefail
          gradle testDebugUnitTest --no-daemon --continue 2>&1 | tee test.log || true
      - name: Report failures
        if: always()
        run: |
          grep -E "FAILED|Exception|Error:|^e: " test.log | head -40 | while IFS= read -r line; do echo "::error::${line//$'\r'/}"; done
          ls app/build/test-results/testDebugUnitTest/ || true
      - name: Save to screens branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp app/build/screens/*.png /tmp/out/ 2>/dev/null || true
          cp app/build/test-results/testDebugUnitTest/*.xml /tmp/out/ 2>/dev/null || true
          cp test.log /tmp/out/ || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan screens
          git rm -rf --quiet .
          cp /tmp/out/* .
          git add -A
          git commit -m "Screenshots ${{ github.sha }}" || true
          git push -f origin screens
