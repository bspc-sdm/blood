name: UI screenshots

# স্ক্রিনগুলোর ছবি (Robolectric) — ফল "screens" শাখায়
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      # প্রতিটা টেস্ট আলাদা প্রসেসে (একসাথে চালালে ৪-৫টার পর JVM বন্ধ হয়ে যায়)
      - name: Run screenshot tests
        run: |
          gradle compileDebugUnitTestKotlin 2>&1 | tail -5
          for t in $(grep -A1 '@Test' app/src/test/java/com/bspc/blood/ScreensTest.kt | grep -oP 'fun \K\w+' | sort -u); do
            echo "=== $t" | tee -a test.log
            gradle testDebugUnitTest --tests "com.bspc.blood.ScreensTest.$t" 2>&1 | grep -E "ScreensTest|Exception|Caused by|at com\.bspc|FAILED|exit value" | head -30 | tee -a test.log || true
          done
      - name: Report failures
        if: always()
        run: |
          grep -E "FAILED|Exception|Error:|^e: " test.log | head -40 | while IFS= read -r line; do echo "::error::${line//$'\r'/}"; done
          ls app/build/test-results/testDebugUnitTest/ || true
      - name: Save to screens branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp app/build/screens/*.png /tmp/out/ 2>/dev/null || true
          cp app/build/test-results/testDebugUnitTest/*.xml /tmp/out/ 2>/dev/null || true
          cp test.log /tmp/out/ || true
          find . -name 'hs_err_pid*.log' -exec cp {} /tmp/out/ \; || true
          find app/build -name '*.log' -path '*test*' -exec cp {} /tmp/out/ \; 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan screens
          git rm -rf --quiet .
          git clean -fdxq
          cp /tmp/out/* .
          git add -A
          git commit -m "Screenshots ${{ github.sha }}" || true
          git push -f origin screens
