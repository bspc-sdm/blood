name: "TMP consent Android compile (health-consent only, never merged)"

# Temporary: proves the Android app compiles with the health-consent change and runs its Robolectric tests.
# Lives only on the health-consent branch; dropped before merging. No APK is built or published.
on:
  push:
    branches: [health-consent]
    paths:
      - "app/**"
      - ".github/workflows/tmp-consent-android.yml"

permissions:
  contents: read

concurrency:
  group: tmp-consent-android
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compile (main + unit tests)
        run: |
          set -o pipefail
          gradle :app:compileDebugKotlin :app:compileDebugUnitTestKotlin 2>&1 | tee compile.log | tail -20
          if grep -qE "^e: " compile.log; then grep -E "^e: " compile.log | head -40; exit 1; fi
      - name: Consent + features tests (Robolectric, one process per test like screens.yml)
        run: |
          fail=0
          for c in ConsentScreensTest FeaturesTest; do
            for t in $(grep -A1 '@Test' "app/src/test/java/com/bspc/blood/$c.kt" | grep -oP 'fun \K\w+' | sort -u); do
              if ! gradle :app:testDebugUnitTest --tests "com.bspc.blood.$c.$t" > "t-$c-$t.log" 2>&1; then
                fail=1
                echo "::error::FAILED $c.$t"
                grep -E "Exception|Error|expected|at com\.bspc|Caused by" "t-$c-$t.log" | head -12 | while IFS= read -r l; do echo "::error::$c.$t ${l//$'\r'/}"; done
                for f in app/build/test-results/testDebugUnitTest/*.xml; do
                  python3 -c "
          import sys, xml.etree.ElementTree as ET
          r = ET.parse(sys.argv[1]).getroot()
          for tc in r.iter('testcase'):
              for bad in list(tc.findall('failure')) + list(tc.findall('error')):
                  print('::error::' + tc.get('name') + ': ' + ' | '.join((bad.text or bad.get('message') or '').splitlines()[:8]))
          " "$f" || true
                done
              else
                echo "ok $c.$t"
              fi
            done
          done
          exit $fail
